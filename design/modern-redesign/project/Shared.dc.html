<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shared files</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';user-select:none}
.ms.fill{font-variation-settings:'FILL' 1}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
[data-motion=off] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,select{font:inherit;color:inherit}
</style>
</helmet>
<div data-motion="{{motion}}" style="position:relative;width:1440px;height:960px;display:flex;font-family:'Roboto Flex',system-ui,sans-serif;font-size:14px;line-height:20px;color:{{onSurface}};background:{{surface}};overflow:hidden">
<nav aria-label="Sections" style="flex:0 0 96px;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:24px">
<button type="button" aria-label="Share a file" style="width:56px;height:56px;border-radius:16px;border:0;background:{{primaryContainer}};color:{{onPrimaryContainer}};display:grid;place-items:center;margin-bottom:16px;box-shadow:0 2px 6px {{shadow}}"><span class="ms" aria-hidden="true">add</span></button>
<sc-for list="{{rail}}" as="r" hint-placeholder-count="8">
<a href="#" style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:{{r.color}};width:80px"><span style="{{r.pill}}"><span class="{{r.iconClass}}" aria-hidden="true">{{r.icon}}</span></span><span style="font-size:12px;line-height:16px;font-weight:500">{{r.label}}</span></a>
</sc-for>
</nav>
<main style="flex:1;padding:24px 24px 24px 0;display:flex;min-width:0">
<div style="flex:1;border-radius:28px;background:{{surfaceContainerLow}};padding:24px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:hidden">
<header style="display:flex;align-items:center;gap:12px">
<div style="flex:1"><h1 style="margin:0;font-size:32px;line-height:40px;font-weight:400">Shared files</h1><p style="margin:4px 0 0;color:{{onSurfaceVariant}};font-size:16px;line-height:24px">{{summary}}</p></div>
<button type="button" style="{{btnTonal}}"><span class="ms" aria-hidden="true" style="font-size:18px">download</span>Receive a file</button>
<button type="button" onClick="{{revokeAll}}" style="{{btnDanger}}"><span class="ms" aria-hidden="true" style="font-size:18px">block</span>Revoke all</button>
</header>
<div style="display:flex;align-items:center;gap:8px">
<label style="display:flex;align-items:center;gap:12px;flex:1;max-width:520px;height:56px;border-radius:999px;background:{{surfaceContainerHigh}};padding:0 8px 0 16px"><span class="ms" aria-hidden="true" style="color:{{onSurfaceVariant}}">search</span><input value="{{q}}" onInput="{{typeQuery}}" placeholder="Search shared files" aria-label="Search shared files" style="flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px"></label>
<button type="button" style="{{btnTonal}}"><span class="ms" aria-hidden="true" style="font-size:18px">regular_expression</span>Regex</button>
</div>
<section aria-label="Shares" style="flex:1;min-height:0;display:flex;flex-direction:column;border-radius:16px;border:1px solid {{outlineVariant}};overflow:hidden">
<div style="display:flex;align-items:center;gap:12px;height:40px;padding:0 16px;color:{{onSurfaceVariant}};font-size:12px;font-weight:500;border-bottom:1px solid {{outlineVariant}};background:{{surfaceContainer}}">
<span style="width:40px"></span><span style="flex:1">File</span><span style="width:80px;text-align:right">Size</span><span style="width:150px">Shared</span><span style="width:150px">Protection</span><span style="width:104px">State</span><span style="width:360px">Actions</span>
</div>
<div role="list" style="flex:1;min-height:0;overflow:auto">
<sc-for list="{{rows}}" as="s" hint-placeholder-count="8">
<div role="listitem" style="{{s.row}}">
<span aria-hidden="true" style="{{s.avatar}}"><span class="ms" style="font-size:22px">{{s.icon}}</span></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:16px;line-height:24px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{s.file}}</span><span style="display:block;color:{{onSurfaceVariant}};font-size:12px;line-height:16px">{{s.sub}}</span></span>
<span style="width:80px;text-align:right">{{s.size}}</span>
<span style="width:150px;color:{{onSurfaceVariant}}">{{s.date}}</span>
<span style="width:150px"><span style="{{s.badge}}"><span class="ms" aria-hidden="true" style="font-size:16px">{{s.badgeIcon}}</span>{{s.badgeLabel}}</span></span>
<span style="width:104px"><span style="{{s.chip}}"><span class="ms" aria-hidden="true" style="font-size:18px">{{s.stateIcon}}</span>{{s.state}}</span></span>
<span style="width:360px;display:flex;gap:4px">
<button type="button" style="{{s.act}}"><span class="ms" aria-hidden="true" style="font-size:18px">content_copy</span>Copy command</button>
<button type="button" style="{{s.act}}"><span class="ms" aria-hidden="true" style="font-size:18px">link</span>Web link</button>
<button type="button" onClick="{{s.revoke}}" style="{{s.actDanger}}"><span class="ms" aria-hidden="true" style="font-size:18px">block</span>Revoke</button>
</span>
</div>
</sc-for>
<p style="{{emptyStyle}}">No shared files match your search.</p>
</div>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seed":{"editor":"enum","options":["green","indigo","amber"],"default":"green"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"motion":{"editor":"enum","options":["on","off"],"default":"on"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { q:'', revoked:{ budget:true } }; }
  renderVals() {
    const t = scheme(this.props.seed ?? 'green', this.props.theme ?? 'dark');
    const s = this.state;
    const railDefs = [['Home','home'],['Drives','hard_drive'],['Offline','offline_pin'],['History','history'],['Backup','cloud_upload'],['Shared','share'],['Tools','build'],['Settings','settings']];
    const sel = 5;
    const base = 'height:40px;padding:0 24px 0 16px;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer;white-space:nowrap;';
    const D = [
      ['report','Quarterly report.pdf','picture_as_pdf','2.4 MB','18 Nov 18:05',true,'Work · to client@example.com'],
      ['contract','Contract.pdf','picture_as_pdf','860 KB','18 Nov 11:20',true,'Work · to legal@example.com'],
      ['wedding','Wedding album.zip','folder_zip','1.2 GB','17 Nov 21:40',true,'Photos 2026 · 3 downloads'],
      ['mix','Studio mix v4.wav','audio_file','86 MB','17 Nov 14:12',false,'Studio · to band group'],
      ['budget','Budget 2027.xlsx','table_chart','420 KB','15 Nov 09:30',true,'Taxes · expired link'],
      ['brief','Brand brief.docx','description','1.1 MB','14 Nov 16:55',false,'Work · to design team'],
      ['scan','Passport scan.jpg','image','3.8 MB','12 Nov 10:08',true,'Scans · single download'],
      ['demo','Product demo.mp4','video_file','412 MB','10 Nov 19:26',true,'Studio · to press list']
    ].map(([id,file,icon,size,date,pass,sub]) => ({ id,file,icon,size,date,pass,sub }));
    const live = D.filter(d => !s.revoked[d.id]).length;
    const q = s.q.toLowerCase();
    const list = D.filter(d => !q || d.file.toLowerCase().includes(q));
    const chip = off => 'display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:8px;font-weight:500;white-space:nowrap;' + (off ? 'border:1px solid ' + t.outlineVariant + ';background:transparent;color:' + t.onSurfaceVariant : 'border:0;background:' + t.secondaryContainer + ';color:' + t.onSecondaryContainer);
    return { ...t, motion: this.props.motion ?? 'on',
      btnTonal: base + 'border:0;background:' + t.secondaryContainer + ';color:' + t.onSecondaryContainer,
      btnDanger: base + 'border:1px solid ' + t.error + ';background:transparent;color:' + t.error,
      q: s.q, typeQuery: e => this.setState({ q: e.target.value }),
      summary: D.length + ' shares · ' + live + ' active · ' + (D.length - live) + ' revoked · encrypted end to end',
      revokeAll: () => { const r = {}; D.forEach(d => r[d.id] = true); this.setState({ revoked: r }); },
      emptyStyle: 'display:' + (list.length ? 'none' : 'block') + ';margin:0;padding:32px;text-align:center;color:' + t.onSurfaceVariant,
      rows: list.map(d => { const off = !!s.revoked[d.id]; const a = 'height:36px;padding:0 12px 0 8px;border-radius:999px;border:0;background:transparent;display:flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap;cursor:' + (off ? 'default' : 'pointer') + ';opacity:' + (off ? '.38' : '1') + ';color:' + t.primary; return { ...d,
        state: off ? 'Revoked' : 'Active', stateIcon: off ? 'block' : 'check_circle', chip: chip(off),
        badgeLabel: d.pass ? 'Passphrase' : 'No passphrase', badgeIcon: d.pass ? 'key' : 'lock_open',
        badge: 'display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;' + (d.pass ? 'background:' + t.tertiaryContainer + ';color:' + t.onTertiaryContainer : 'border:1px solid ' + t.outlineVariant + ';color:' + t.onSurfaceVariant),
        revoke: () => { const r = { ...s.revoked }; r[d.id] = true; this.setState({ revoked: r }); },
        act: a, actDanger: a.replace('color:' + t.primary, 'color:' + t.error),
        avatar: 'flex:0 0 40px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:' + t.surfaceContainerHighest + ';color:' + t.onSurfaceVariant,
        row: 'display:flex;align-items:center;gap:12px;height:72px;box-sizing:border-box;padding:0 16px;border-bottom:1px solid ' + t.outlineVariant + ';animation:enter 320ms cubic-bezier(.05,.7,.1,1) both' }; }),
      rail: railDefs.map(([label, icon], i) => ({ label, icon, iconClass: i === sel ? 'ms fill' : 'ms', color: i === sel ? t.onSurface : t.onSurfaceVariant,
        pill: 'width:56px;height:32px;border-radius:16px;display:grid;place-items:center;background:' + (i === sel ? t.secondaryContainer : 'transparent') + ';color:' + (i === sel ? t.onSecondaryContainer : 'inherit') }))
    };
  }
}
function scheme(seed, theme) {
  const dark = theme !== 'light';
  const seeds = {
    green:  dark ? { primary:'#8FD6B0', onPrimary:'#003825', primaryContainer:'#00513A', onPrimaryContainer:'#AAF2CB', secondaryContainer:'#354B40', onSecondaryContainer:'#CFE9D9', tertiaryContainer:'#234C5D', onTertiaryContainer:'#C1E8FB' }
                 : { primary:'#2B6A4E', onPrimary:'#FFFFFF', primaryContainer:'#AFF1CE', onPrimaryContainer:'#002114', secondaryContainer:'#CFE9D9', onSecondaryContainer:'#0B1F15', tertiaryContainer:'#C1E8FB', onTertiaryContainer:'#001F2A' },
    indigo: dark ? { primary:'#B9C3FF', onPrimary:'#1F2C61', primaryContainer:'#364379', onPrimaryContainer:'#DDE1FF', secondaryContainer:'#424659', onSecondaryContainer:'#DFE1F9', tertiaryContainer:'#5C3D58', onTertiaryContainer:'#FFD6F7' }
                 : { primary:'#4D5C92', onPrimary:'#FFFFFF', primaryContainer:'#DDE1FF', onPrimaryContainer:'#05164B', secondaryContainer:'#DFE1F9', onSecondaryContainer:'#171B2C', tertiaryContainer:'#FFD6F7', onTertiaryContainer:'#2C1229' },
    amber:  dark ? { primary:'#F5BD6F', onPrimary:'#452B00', primaryContainer:'#633F00', onPrimaryContainer:'#FFDDB3', secondaryContainer:'#574431', onSecondaryContainer:'#FBDEBC', tertiaryContainer:'#3E4E2E', onTertiaryContainer:'#D5EDBA' }
                 : { primary:'#835416', onPrimary:'#FFFFFF', primaryContainer:'#FFDDB3', onPrimaryContainer:'#2A1700', secondaryContainer:'#FBDEBC', onSecondaryContainer:'#271904', tertiaryContainer:'#D5EDBA', onTertiaryContainer:'#11200A' }
  };
  const neutral = dark
    ? { surface:'#101413', surfaceContainerLowest:'#0B0F0E', surfaceContainerLow:'#181D1B', surfaceContainer:'#1C211F', surfaceContainerHigh:'#272B29', surfaceContainerHighest:'#313634', onSurface:'#E0E3E0', onSurfaceVariant:'#C0C9C3', outline:'#8A938D', outlineVariant:'#404944', error:'#FFB4AB', onError:'#690005', errorContainer:'#93000A', onErrorContainer:'#FFDAD6', inverseSurface:'#E0E3E0', inverseOnSurface:'#2D3130', scrim:'rgba(0,0,0,.5)', shadow:'rgba(0,0,0,.45)' }
    : { surface:'#F7FAF7', surfaceContainerLowest:'#FFFFFF', surfaceContainerLow:'#F1F4F1', surfaceContainer:'#EBEFEB', surfaceContainerHigh:'#E6E9E6', surfaceContainerHighest:'#E0E3E0', onSurface:'#191C1B', onSurfaceVariant:'#404944', outline:'#707973', outlineVariant:'#C0C9C3', error:'#BA1A1A', onError:'#FFFFFF', errorContainer:'#FFDAD6', onErrorContainer:'#410002', inverseSurface:'#2D3130', inverseOnSurface:'#EEF1EE', scrim:'rgba(0,0,0,.32)', shadow:'rgba(0,0,0,.18)' };
  return { ...neutral, ...(seeds[seed] || seeds.green) };
}
</script>
</body>
</html>
