<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
[data-motion=off] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input{font:inherit;color:inherit}
</style>
</helmet>
<div data-motion="{{motion}}" style="width:1440px;height:960px;display:flex;gap:20px;padding:20px;box-sizing:border-box;font-family:'Roboto Flex',system-ui,sans-serif;font-size:14px;color:{{text}};background:{{bg}};overflow:hidden">
<nav aria-label="Sections" style="flex:0 0 84px;border-radius:32px;background:{{rail}}"></nav>
<main style="flex:1;display:flex;flex-direction:column;gap:18px;min-width:0">
<h1 style="margin:0;font-size:40px;font-weight:850;letter-spacing:-.02em">Settings</h1>
<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
<label style="flex:1;min-width:320px;display:flex;align-items:center;gap:10px;height:56px;border-radius:28px;background:{{surface}};padding:0 20px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{muted}}" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input value="{{query}}" onInput="{{type}}" placeholder="Search settings" aria-label="Search settings" style="flex:1;border:0;background:transparent;outline:0;font-size:16px"></label>
<button type="button" aria-pressed="{{regexOn}}" onClick="{{toggleRegex}}" style="{{regexStyle}}">.* Regex</button>
</div>
<sc-if value="{{regex}}" hint-placeholder-val="{{ false }}">
<div style="border-radius:24px;background:{{surface}};padding:16px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;animation:rise 240ms both"><b>Regex builder</b><code style="padding:6px 10px;border-radius:10px;background:{{surface2}}">^back(up|ing)</code><span style="color:{{muted}}">flags: i · matches 4 settings</span><span style="flex:1"></span><button type="button" style="height:40px;padding:0 16px;border-radius:20px;border:1px solid {{outline}};background:transparent">Open full builder</button></div>
</sc-if>
<div style="flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;min-height:0;overflow:auto">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
<section aria-label="{{g.title}}" style="border-radius:28px;background:{{surface}};padding:20px;display:flex;flex-direction:column;gap:6px;animation:rise 300ms both">
<h2 style="margin:0 0 6px;font-size:18px;font-weight:750">{{g.title}}</h2>
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
<label style="display:flex;align-items:center;gap:12px;min-height:52px;border-radius:16px;padding:0 6px"><span style="flex:1"><b style="display:block;font-weight:600">{{i.label}}</b><span style="font-size:12px;color:{{muted}}">{{i.help}}</span></span><input type="checkbox" checked="{{i.on}}" style="width:44px;height:24px;accent-color:{{accent}}"></label>
</sc-for>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7FD9A8","options":["#7FD9A8","#B9C3FF","#FFB59E","#F2C94C"]},"theme":{"editor":"enum","options":["night","day"],"default":"night"},"motion":{"editor":"enum","options":["on","off"],"default":"on"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { query: '', regex: false }; }
  renderVals() {
    const day = (this.props.theme ?? 'night') === 'day', accent = this.props.accent ?? '#7FD9A8';
    const c = day ? { bg:'#F3F4F8', rail:'#FFFFFF', surface:'#FFFFFF', surface2:'#EEF0F6', text:'#15161C', muted:'#555766', outline:'#C3C5D2' }
                  : { bg:'#0E0F13', rail:'#17181F', surface:'#17181F', surface2:'#22232C', text:'#ECEDF4', muted:'#A6A8B8', outline:'#3A3C48' };
    const all = [
      ['Backup', [['Back up automatically','About a minute after changes',true],['Back up on lock','When changes are waiting',true],['Pack to 80 MiB before backup','Fewer, larger parts on Docker Hub',true]]],
      ['Appearance', [['Dark theme','Follows Windows when off',true],['Reduced motion','Stops animations',false],['Drive banners in lists','Uses each drive\'s banner',true]]],
      ['Language', [['Bilingual labels','English and Cantonese side by side',false],['24-hour time','For every time shown',true]]],
      ['Privacy', [['Lock when idle','After 15 minutes',true],['Clear clipboard','30 seconds after copying a share',true]]],
      ['Notifications', [['Backup finished','A quiet toast',true],['Sounds','Short cues for actions',true]]],
      ['File hosting', [['Check instances on open','Health is checked, never assumed',true],['Remove from Docker Hub when a link ends','Default for new links',false]]]
    ];
    const q = this.state.query.trim().toLowerCase();
    const groups = all.map(([title, items]) => ({ title, items: items.filter(([label,help]) => !q || (label+help+title).toLowerCase().includes(q)).map(([label,help,on]) => ({ label, help, on })) })).filter(g => g.items.length);
    return { ...c, accent, motion: this.props.motion ?? 'on', query: this.state.query, groups,
      type: e => this.setState({ query: e.target.value }), regex: this.state.regex, regexOn: String(this.state.regex),
      toggleRegex: () => this.setState({ regex: !this.state.regex }),
      regexStyle: 'height:56px;padding:0 22px;border-radius:28px;border:' + (this.state.regex?'0':'1px solid '+c.outline) + ';background:' + (this.state.regex?accent:'transparent') + ';color:' + (this.state.regex?'#06281A':c.text) + ';font-weight:700;font-family:monospace' };
  }
}
</script>
</body>
</html>
