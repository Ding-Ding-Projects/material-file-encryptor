<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Dialog</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="modern.css">
<link rel="stylesheet" href="material-dialog.css">
<script type="module" src="material-dialog.js"></script>
</head>
<body class="material-dialog-body">
<main class="material-dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-message" aria-describedby="dialog-detail">
  <p class="material-dialog-title" id="dialog-title"></p>
  <div class="material-dialog-icon" id="dialog-icon" aria-hidden="true"></div>
  <h1 id="dialog-message"></h1>
  <p id="dialog-detail"></p>
  <div class="material-dialog-actions" id="dialog-actions"></div>
</main>
</body>
</html>
