name: Windows preview delivery
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: windows-preview-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record build start
        shell: powershell
        run: '"BUILD_STARTED_AT=$([DateTime]::UtcNow.ToString(''o''))" | Out-File $env:GITHUB_ENV -Append -Encoding utf8'
      - name: Build application
        shell: cmd
        run: build.bat /s
      - name: Package genuine unsigned Squirrel installer
        shell: cmd
        run: build-installer.bat /s
      - name: Prepare and publish unique preview
        shell: powershell
        run: |
          . ./scripts/bootstrap.ps1
          ./.github/scripts/publish-preview.ps1
      - name: Record safe result
        if: always()
        continue-on-error: true
        shell: powershell
        env:
          BUILD_JOB_STATUS: ${{ job.status }}
        run: |
          New-Item -ItemType Directory -Force out/evidence | Out-Null
          @{ commit=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID; status=$env:BUILD_JOB_STATUS; runtimeVerification='pending independent local receipt' } | ConvertTo-Json | Set-Content out/evidence/build-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: windows-installer-and-evidence
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
            out/evidence/*.json
            release-output/*
          if-no-files-found: warn
          retention-days: 14
