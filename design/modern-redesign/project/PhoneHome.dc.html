<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';user-select:none}
.ms.fill{font-variation-settings:'FILL' 1}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
[data-motion=off] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,select{font:inherit;color:inherit}
.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div data-motion="{{motion}}" style="width:390px;height:844px;position:relative;display:flex;flex-direction:column;font-family:'Roboto Flex',system-ui,sans-serif;font-size:14px;line-height:20px;color:{{onSurface}};background:{{surface}};overflow:hidden">
<header style="flex:0 0 64px;display:flex;align-items:center;gap:4px;padding:0 4px 0 20px">
<h1 style="margin:0;flex:1;font-size:22px;line-height:28px;font-weight:400">Home</h1>
<button type="button" aria-label="Search" style="width:48px;height:48px;border-radius:999px;border:0;background:transparent;color:{{onSurfaceVariant}};display:grid;place-items:center"><span class="ms" aria-hidden="true">search</span></button>
<button type="button" aria-label="More options" style="width:48px;height:48px;border-radius:999px;border:0;background:transparent;color:{{onSurfaceVariant}};display:grid;place-items:center"><span class="ms" aria-hidden="true">more_vert</span></button>
</header>
<main class="scroll" style="flex:1;overflow:auto;padding:4px 16px 96px;display:flex;flex-direction:column;gap:16px;min-height:0">
<section aria-label="Backing up now" style="border-radius:28px;background:{{surfaceContainerHighest}};padding:20px;display:flex;flex-direction:column;gap:12px;flex:0 0 auto;animation:enter 320ms cubic-bezier(.05,.7,.1,1) both">
<div style="display:flex;align-items:center;gap:12px"><span class="ms fill" aria-hidden="true" style="color:{{primary}}">cloud_upload</span><h2 style="margin:0;flex:1;font-size:16px;line-height:24px;font-weight:500">Backing up Studio</h2><span style="color:{{onSurfaceVariant}}">about 0:24 left</span></div>
<div style="display:flex;align-items:center;gap:12px"><span style="font-size:36px;line-height:44px">62%</span><div aria-hidden="true" style="flex:1;height:4px;border-radius:999px;background:{{secondaryContainer}};overflow:hidden"><div style="width:62%;height:100%;background:{{primary}};border-radius:999px"></div></div></div>
<div style="display:flex;align-items:center;gap:8px"><span style="flex:1;color:{{onSurfaceVariant}}">48 MB/s · 22 of 36 parts</span>
<button type="button" style="height:40px;padding:0 24px 0 16px;border-radius:999px;border:1px solid {{outline}};background:transparent;color:{{primary}};display:flex;align-items:center;gap:8px;font-weight:500"><span class="ms" aria-hidden="true" style="font-size:18px">close</span>Cancel</button></div>
</section>
<h2 style="margin:4px 4px 0;font-size:16px;line-height:24px;font-weight:500">Your drives</h2>
<sc-for list="{{drives}}" as="d" hint-placeholder-count="3">
<button type="button" onClick="{{d.pick}}" style="{{d.card}}">
<span aria-hidden="true" style="{{d.banner}}"></span>
<span style="display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left">
<span aria-hidden="true" style="{{d.avatar}}">{{d.letter}}</span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:16px;line-height:24px;font-weight:500">{{d.name}}</span><span style="color:{{onSurfaceVariant}}">{{d.where}}</span></span>
<span style="{{d.chip}}"><span class="ms" aria-hidden="true" style="font-size:18px">{{d.stateIcon}}</span>{{d.state}}</span>
</span>
</button>
</sc-for>
</main>
<button type="button" aria-label="New drive" style="position:absolute;right:16px;bottom:96px;height:56px;padding:0 20px 0 16px;border-radius:16px;border:0;background:{{primaryContainer}};color:{{onPrimaryContainer}};display:flex;align-items:center;gap:12px;font-size:16px;font-weight:500;box-shadow:0 3px 8px {{shadow}}"><span class="ms" aria-hidden="true">add</span>New drive</button>
<nav aria-label="Main" style="flex:0 0 80px;display:flex;background:{{surfaceContainer}};padding:12px 8px 16px;box-sizing:border-box">
<sc-for list="{{tabs}}" as="n" hint-placeholder-count="4">
<a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:{{n.color}}"><span style="{{n.pill}}"><span class="{{n.iconClass}}" aria-hidden="true">{{n.icon}}</span></span><span style="font-size:12px;line-height:16px;font-weight:500">{{n.label}}</span></a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seed":{"editor":"enum","options":["green","indigo","amber"],"default":"green"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"motion":{"editor":"enum","options":["on","off"],"default":"on"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { picked: 'studio' }; }
  renderVals() {
    const t = scheme(this.props.seed ?? 'green', this.props.theme ?? 'dark');
    const SEL = 0;
    const tabDefs = [['Home','home'],['Drives','hard_drive'],['Backup','cloud_upload'],['Settings','settings']];
    const driveDefs = [
      { id:'studio', name:'Studio', where:'Q: · 2.8 GB', letter:'S', state:'Backing up', stateIcon:'cloud_upload', banner:'linear-gradient(120deg,#3B5BA9,#8E5EA8 55%,#D98E5A)' },
      { id:'photos', name:'Photos 2026', where:'P: · 312 MB', letter:'P', state:'Waiting', stateIcon:'schedule', banner:'linear-gradient(120deg,#1F6F5C,#8FD6B0)' },
      { id:'work', name:'Work', where:'E: · locked', letter:'W', state:'Locked', stateIcon:'lock', banner:null }
    ];
    return { ...t, motion: this.props.motion ?? 'on',
      tabs: tabDefs.map(([label, icon], i) => ({ label, icon, iconClass: i === SEL ? 'ms fill' : 'ms', color: i === SEL ? t.onSurface : t.onSurfaceVariant,
        pill: 'width:64px;height:32px;border-radius:16px;display:grid;place-items:center;background:' + (i === SEL ? t.secondaryContainer : 'transparent') + ';color:' + (i === SEL ? t.onSecondaryContainer : 'inherit') })),
      drives: driveDefs.map(d => { const busy = d.state === 'Backing up'; return { ...d, pick: () => this.setState({ picked: d.id }),
        card: 'border-radius:12px;padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;flex:0 0 auto;text-align:left;background:' + t.surfaceContainerHighest + ';border:' + (this.state.picked === d.id ? '2px solid ' + t.primary : '2px solid transparent') + ';animation:enter 320ms cubic-bezier(.05,.7,.1,1) both',
        banner: 'height:64px;background:' + (d.banner || t.surfaceContainerHigh),
        avatar: 'width:40px;height:40px;border-radius:999px;display:grid;place-items:center;font-size:16px;font-weight:500;background:' + t.primaryContainer + ';color:' + t.onPrimaryContainer,
        chip: 'display:flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:8px;font-weight:500;background:' + (busy ? t.secondaryContainer : 'transparent') + ';border:' + (busy ? '0' : '1px solid ' + t.outlineVariant) + ';color:' + (busy ? t.onSecondaryContainer : t.onSurfaceVariant) }; })
    };
  }
}
function scheme(seed, theme) {
  const dark = theme !== 'light';
  const seeds = {
    green:  dark ? { primary:'#8FD6B0', onPrimary:'#003825', primaryContainer:'#00513A', onPrimaryContainer:'#AAF2CB', secondaryContainer:'#354B40', onSecondaryContainer:'#CFE9D9', tertiaryContainer:'#234C5D', onTertiaryContainer:'#C1E8FB' }
                 : { primary:'#2B6A4E', onPrimary:'#FFFFFF', primaryContainer:'#AFF1CE', onPrimaryContainer:'#002114', secondaryContainer:'#CFE9D9', onSecondaryContainer:'#0B1F15', tertiaryContainer:'#C1E8FB', onTertiaryContainer:'#001F2A' },
    indigo: dark ? { primary:'#B9C3FF', onPrimary:'#1F2C61', primaryContainer:'#364379', onPrimaryContainer:'#DDE1FF', secondaryContainer:'#424659', onSecondaryContainer:'#DFE1F9', tertiaryContainer:'#5C3D58', onTertiaryContainer:'#FFD6F7' }
                 : { primary:'#4D5C92', onPrimary:'#FFFFFF', primaryContainer:'#DDE1FF', onPrimaryContainer:'#05164B', secondaryContainer:'#DFE1F9', onSecondaryContainer:'#171B2C', tertiaryContainer:'#FFD6F7', onTertiaryContainer:'#2C1229' },
    amber:  dark ? { primary:'#F5BD6F', onPrimary:'#452B00', primaryContainer:'#633F00', onPrimaryContainer:'#FFDDB3', secondaryContainer:'#574431', onSecondaryContainer:'#FBDEBC', tertiaryContainer:'#3E4E2E', onTertiaryContainer:'#D5EDBA' }
                 : { primary:'#835416', onPrimary:'#FFFFFF', primaryContainer:'#FFDDB3', onPrimaryContainer:'#2A1700', secondaryContainer:'#FBDEBC', onSecondaryContainer:'#271904', tertiaryContainer:'#D5EDBA', onTertiaryContainer:'#11200A' }
  };
  const neutral = dark
    ? { surface:'#101413', surfaceContainerLowest:'#0B0F0E', surfaceContainerLow:'#181D1B', surfaceContainer:'#1C211F', surfaceContainerHigh:'#272B29', surfaceContainerHighest:'#313634', onSurface:'#E0E3E0', onSurfaceVariant:'#C0C9C3', outline:'#8A938D', outlineVariant:'#404944', error:'#FFB4AB', onError:'#690005', errorContainer:'#93000A', onErrorContainer:'#FFDAD6', inverseSurface:'#E0E3E0', inverseOnSurface:'#2D3130', scrim:'rgba(0,0,0,.5)', shadow:'rgba(0,0,0,.45)' }
    : { surface:'#F7FAF7', surfaceContainerLowest:'#FFFFFF', surfaceContainerLow:'#F1F4F1', surfaceContainer:'#EBEFEB', surfaceContainerHigh:'#E6E9E6', surfaceContainerHighest:'#E0E3E0', onSurface:'#191C1B', onSurfaceVariant:'#404944', outline:'#707973', outlineVariant:'#C0C9C3', error:'#BA1A1A', onError:'#FFFFFF', errorContainer:'#FFDAD6', onErrorContainer:'#410002', inverseSurface:'#2D3130', inverseOnSurface:'#EEF1EE', scrim:'rgba(0,0,0,.32)', shadow:'rgba(0,0,0,.18)' };
  return { ...neutral, ...(seeds[seed] || seeds.green) };
}
</script>
</body>
</html>
