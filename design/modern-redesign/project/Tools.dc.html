<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local tools</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';user-select:none}
.ms.fill{font-variation-settings:'FILL' 1}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
[data-motion=off] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,select{font:inherit;color:inherit}
</style>
</helmet>
<div data-motion="{{motion}}" style="width:1440px;height:960px;display:flex;font-family:'Roboto Flex',system-ui,sans-serif;font-size:14px;line-height:20px;color:{{onSurface}};background:{{surface}};overflow:hidden">
<nav aria-label="Sections" style="flex:0 0 96px;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:24px">
<button type="button" aria-label="Open a tool" style="width:56px;height:56px;border-radius:16px;border:0;background:{{primaryContainer}};color:{{onPrimaryContainer}};display:grid;place-items:center;margin-bottom:16px;box-shadow:0 2px 6px {{shadow}}"><span class="ms" aria-hidden="true">add</span></button>
<sc-for list="{{rail}}" as="r" hint-placeholder-count="8">
<a href="#" style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:{{r.color}};width:80px"><span style="{{r.pill}}"><span class="{{r.iconClass}}" aria-hidden="true">{{r.icon}}</span></span><span style="font-size:12px;line-height:16px;font-weight:500">{{r.label}}</span></a>
</sc-for>
</nav>
<main style="flex:1;padding:24px 24px 24px 0;display:flex;min-width:0">
<div style="flex:1;border-radius:28px;background:{{surfaceContainerLow}};padding:24px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:hidden">
<header style="display:flex;align-items:center;gap:12px">
<div style="flex:1"><h1 style="margin:0;font-size:32px;line-height:40px;font-weight:400">Local tools</h1><p style="margin:4px 0 0;color:{{onSurfaceVariant}};font-size:16px;line-height:24px">{{subtitle}}</p></div>
<label style="display:flex;align-items:center;gap:12px;width:420px;height:56px;border-radius:999px;background:{{surfaceContainerHigh}};padding:0 8px 0 16px"><span class="ms" aria-hidden="true" style="color:{{onSurfaceVariant}}">search</span><input value="{{query}}" onInput="{{onQuery}}" placeholder="{{placeholder}}" aria-label="Search tools" style="flex:1;border:0;background:transparent;outline:0;font-size:16px"></label>
<button type="button" aria-pressed="{{regexOn}}" onClick="{{toggleRegex}}" style="{{regexBtn}}"><span class="ms" aria-hidden="true" style="font-size:18px">regular_expression</span>Regex</button>
</header>
<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap" role="group" aria-label="Recently used">
<span style="display:flex;align-items:center;gap:6px;color:{{onSurfaceVariant}};font-weight:500;margin-right:4px"><span class="ms" aria-hidden="true" style="font-size:20px">history</span>Recently used</span>
<sc-for list="{{recent}}" as="c" hint-placeholder-count="4"><button type="button" onClick="{{c.pick}}" style="{{c.style}}"><span class="ms" aria-hidden="true" style="font-size:18px">{{c.icon}}</span>{{c.label}}</button></sc-for>
</div>
<section aria-label="Tools" style="flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:16px;min-height:0">
<sc-for list="{{tools}}" as="c" hint-placeholder-count="8">
<article style="border-radius:12px;background:{{surfaceContainer}};box-shadow:0 1px 3px {{shadow}};padding:20px;display:flex;flex-direction:column;gap:12px;min-height:0;animation:enter 320ms cubic-bezier(.05,.7,.1,1) both">
<span aria-hidden="true" style="width:56px;height:56px;border-radius:999px;display:grid;place-items:center;background:{{primaryContainer}};color:{{onPrimaryContainer}}"><span class="ms fill" style="font-size:28px">{{c.icon}}</span></span>
<h2 style="margin:4px 0 0;font-size:22px;line-height:28px;font-weight:400">{{c.title}}</h2>
<p style="margin:0;color:{{onSurfaceVariant}};font-size:14px;line-height:20px">{{c.text}}</p>
<button type="button" style="margin-top:auto;align-self:flex-start;height:40px;padding:0 24px 0 16px;border-radius:999px;border:0;background:{{secondaryContainer}};color:{{onSecondaryContainer}};display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer"><span class="ms" aria-hidden="true" style="font-size:18px">{{c.openIcon}}</span>Open</button>
</article>
</sc-for>
</section>
<p style="{{emptyStyle}}">No tools match this search.</p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seed":{"editor":"enum","options":["green","indigo","amber"],"default":"green"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"motion":{"editor":"enum","options":["on","off"],"default":"on"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { query: '', regex: false }; }
  renderVals() {
    const t = scheme(this.props.seed ?? 'green', this.props.theme ?? 'dark');
    const S = this.state;
    const railDefs = [['Home','home'],['Drives','hard_drive'],['Offline','offline_pin'],['History','history'],['Backup','cloud_upload'],['Shared','share'],['Tools','build'],['Settings','settings']];
    const defs = [
      ['File converter','transform','Change documents, images and audio to another format without leaving this computer.','open_in_new'],
      ['Local AI models','neurology','Download and run language models on this computer. Nothing is sent online.','open_in_new'],
      ['Server manager','dns','Start, stop and watch the servers you run from your drives.','open_in_new'],
      ['Split storage','call_split','Spread one drive across several folders or disks and keep it as one.','open_in_new'],
      ['Drive images','hard_drive','Create a drive image, mount one, or write an image to a USB stick.','open_in_new'],
      ['File hosting','cloud_upload','Make selected folders available as download links on your network.','open_in_new'],
      ['Share a file','share','Send one file with a link, a password and an expiry time.','open_in_new'],
      ['Receive a file','download','Let someone send you a file straight into a drive.','open_in_new']
    ];
    const q = (S.query || '').trim();
    let test = () => true, bad = false;
    if (q) {
      if (S.regex) { try { const re = new RegExp(q, 'i'); test = d => re.test(d[0] + ' ' + d[2]); } catch (e) { bad = true; test = () => false; } }
      else test = d => (d[0] + ' ' + d[2]).toLowerCase().includes(q.toLowerCase());
    }
    const shown = defs.filter(test);
    const recentDefs = [['File converter','transform'],['Share a file','share'],['Drive images','hard_drive'],['File hosting','cloud_upload']];
    return { ...t, motion: this.props.motion ?? 'on',
      rail: railDefs.map(([label, icon], i) => ({ label, icon, iconClass: i === 6 ? 'ms fill' : 'ms', color: i === 6 ? t.onSurface : t.onSurfaceVariant,
        pill: 'width:56px;height:32px;border-radius:16px;display:grid;place-items:center;background:' + (i === 6 ? t.secondaryContainer : 'transparent') + ';color:' + (i === 6 ? t.onSecondaryContainer : 'inherit') })),
      subtitle: q ? (bad ? 'That regular expression is not valid' : shown.length + ' of ' + defs.length + ' tools match') : '8 tools · all of them work offline',
      query: S.query, placeholder: S.regex ? 'Search with a regular expression' : 'Search tools',
      onQuery: (e) => this.setState({ query: e.target.value }),
      regexOn: String(S.regex), toggleRegex: () => this.setState({ regex: !S.regex }),
      regexBtn: 'height:40px;padding:0 16px 0 12px;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer;border:' + (S.regex ? '0' : '1px solid ' + t.outline) + ';background:' + (S.regex ? t.primary : t.secondaryContainer) + ';color:' + (S.regex ? t.onPrimary : t.onSecondaryContainer),
      recent: recentDefs.map(([label, icon]) => { const on = q.toLowerCase() === label.toLowerCase(); return { label, icon: on ? 'check' : icon, pick: () => this.setState({ query: on ? '' : label, regex: false }),
        style: 'height:32px;padding:0 12px 0 8px;border-radius:8px;display:flex;align-items:center;gap:6px;font-weight:500;cursor:pointer;border:' + (on ? '0' : '1px solid ' + t.outlineVariant) + ';background:' + (on ? t.secondaryContainer : 'transparent') + ';color:' + (on ? t.onSecondaryContainer : t.onSurfaceVariant) }; }),
      tools: shown.map(([title, icon, text, openIcon]) => ({ title, icon, text, openIcon })),
      emptyStyle: shown.length ? 'display:none' : 'margin:0;color:' + t.onSurfaceVariant + ';font-size:16px'
    };
  }
}
function scheme(seed, theme) {
  const dark = theme !== 'light';
  const seeds = {
    green:  dark ? { primary:'#8FD6B0', onPrimary:'#003825', primaryContainer:'#00513A', onPrimaryContainer:'#AAF2CB', secondaryContainer:'#354B40', onSecondaryContainer:'#CFE9D9', tertiaryContainer:'#234C5D', onTertiaryContainer:'#C1E8FB' }
                 : { primary:'#2B6A4E', onPrimary:'#FFFFFF', primaryContainer:'#AFF1CE', onPrimaryContainer:'#002114', secondaryContainer:'#CFE9D9', onSecondaryContainer:'#0B1F15', tertiaryContainer:'#C1E8FB', onTertiaryContainer:'#001F2A' },
    indigo: dark ? { primary:'#B9C3FF', onPrimary:'#1F2C61', primaryContainer:'#364379', onPrimaryContainer:'#DDE1FF', secondaryContainer:'#424659', onSecondaryContainer:'#DFE1F9', tertiaryContainer:'#5C3D58', onTertiaryContainer:'#FFD6F7' }
                 : { primary:'#4D5C92', onPrimary:'#FFFFFF', primaryContainer:'#DDE1FF', onPrimaryContainer:'#05164B', secondaryContainer:'#DFE1F9', onSecondaryContainer:'#171B2C', tertiaryContainer:'#FFD6F7', onTertiaryContainer:'#2C1229' },
    amber:  dark ? { primary:'#F5BD6F', onPrimary:'#452B00', primaryContainer:'#633F00', onPrimaryContainer:'#FFDDB3', secondaryContainer:'#574431', onSecondaryContainer:'#FBDEBC', tertiaryContainer:'#3E4E2E', onTertiaryContainer:'#D5EDBA' }
                 : { primary:'#835416', onPrimary:'#FFFFFF', primaryContainer:'#FFDDB3', onPrimaryContainer:'#2A1700', secondaryContainer:'#FBDEBC', onSecondaryContainer:'#271904', tertiaryContainer:'#D5EDBA', onTertiaryContainer:'#11200A' }
  };
  const neutral = dark
    ? { surface:'#101413', surfaceContainerLowest:'#0B0F0E', surfaceContainerLow:'#181D1B', surfaceContainer:'#1C211F', surfaceContainerHigh:'#272B29', surfaceContainerHighest:'#313634', onSurface:'#E0E3E0', onSurfaceVariant:'#C0C9C3', outline:'#8A938D', outlineVariant:'#404944', error:'#FFB4AB', onError:'#690005', errorContainer:'#93000A', onErrorContainer:'#FFDAD6', inverseSurface:'#E0E3E0', inverseOnSurface:'#2D3130', scrim:'rgba(0,0,0,.5)', shadow:'rgba(0,0,0,.45)' }
    : { surface:'#F7FAF7', surfaceContainerLowest:'#FFFFFF', surfaceContainerLow:'#F1F4F1', surfaceContainer:'#EBEFEB', surfaceContainerHigh:'#E6E9E6', surfaceContainerHighest:'#E0E3E0', onSurface:'#191C1B', onSurfaceVariant:'#404944', outline:'#707973', outlineVariant:'#C0C9C3', error:'#BA1A1A', onError:'#FFFFFF', errorContainer:'#FFDAD6', onErrorContainer:'#410002', inverseSurface:'#2D3130', inverseOnSurface:'#EEF1EE', scrim:'rgba(0,0,0,.32)', shadow:'rgba(0,0,0,.18)' };
  return { ...neutral, ...(seeds[seed] || seeds.green) };
}
</script>
</body>
</html>
