name: Publish documentation site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/site/**', 'docs/images/**', 'docs/features/**', 'DESIGN.md', 'scripts/build-site.mjs', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Bootstrap locked static-site dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bootstrap pinned GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null; then sudo apt-get update && sudo apt-get install -y gh; fi
          if ! gh --version | head -1 | grep -F 'gh version 2.102.0 '; then
            mkdir -p "$RUNNER_TEMP/visitor-gh"
            gh release download v2.102.0 --repo cli/cli --dir "$RUNNER_TEMP/visitor-gh" --pattern 'gh_2.102.0_linux_amd64.tar.gz' --pattern 'gh_2.102.0_checksums.txt'
            (cd "$RUNNER_TEMP/visitor-gh" && sha256sum --check --ignore-missing gh_2.102.0_checksums.txt)
            tar -xzf "$RUNNER_TEMP/visitor-gh/gh_2.102.0_linux_amd64.tar.gz" -C "$RUNNER_TEMP/visitor-gh"
            echo "$RUNNER_TEMP/visitor-gh/gh_2.102.0_linux_amd64/bin" >> "$GITHUB_PATH"
          fi
      - name: Read back supported GitHub CLI
        run: |
          set -euo pipefail
          actualVersion=$(gh --version | head -1)
          if [[ "$actualVersion" != "gh version 2.102.0 "* ]]; then
            echo 'Pinned GitHub CLI is unavailable after bootstrap.' >&2
            exit 1
          fi
          printf '%s\n' "$actualVersion"
      - name: Stage site and shared images
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
          token: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out/site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Update and verify repository homepage
        if: github.repository == 'Ding-Ding-Projects/material-file-encryptor'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expectedHomepage=https://ding-ding-projects.github.io/material-file-encryptor/
          gh api --method PATCH repos/Ding-Ding-Projects/material-file-encryptor -f homepage=https://ding-ding-projects.github.io/material-file-encryptor/ --silent
          actualHomepage=$(gh api repos/Ding-Ding-Projects/material-file-encryptor --jq .homepage)
          if [ "$actualHomepage" != "$expectedHomepage" ]; then
            echo 'Repository homepage readback differs from the deployed documentation URL.' >&2
            exit 1
          fi
          echo "Verified repository homepage: $actualHomepage"
