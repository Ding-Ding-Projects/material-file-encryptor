<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recycle Bin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';user-select:none}
.ms.fill{font-variation-settings:'FILL' 1}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
[data-motion=off] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,select{font:inherit;color:inherit}
</style>
</helmet>
<div data-motion="{{motion}}" style="width:1440px;height:960px;display:flex;font-family:'Roboto Flex',system-ui,sans-serif;font-size:14px;line-height:20px;color:{{onSurface}};background:{{surface}};overflow:hidden">
<nav aria-label="Sections" style="flex:0 0 96px;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:24px">
<button type="button" aria-label="Restore selected items" style="width:56px;height:56px;border-radius:16px;border:0;background:{{primaryContainer}};color:{{onPrimaryContainer}};display:grid;place-items:center;margin-bottom:16px;box-shadow:0 2px 6px {{shadow}}"><span class="ms" aria-hidden="true">restore_from_trash</span></button>
<sc-for list="{{rail}}" as="r" hint-placeholder-count="8">
<a href="#" style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:{{r.color}};width:80px"><span style="{{r.pill}}"><span class="{{r.iconClass}}" aria-hidden="true">{{r.icon}}</span></span><span style="font-size:12px;line-height:16px;font-weight:500">{{r.label}}</span></a>
</sc-for>
</nav>
<main style="flex:1;padding:24px 24px 24px 0;display:flex;min-width:0">
<div style="flex:1;border-radius:28px;background:{{surfaceContainerLow}};padding:24px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:hidden">
<header style="display:flex;align-items:center;gap:12px">
<div style="flex:1"><h1 style="margin:0;font-size:32px;line-height:40px;font-weight:400">Recycle Bin</h1><p style="margin:4px 0 0;color:{{onSurfaceVariant}};font-size:16px;line-height:24px">9 deleted items · 1.9 GB</p></div>
<label style="{{searchBox}}"><span class="ms" aria-hidden="true" style="color:{{onSurfaceVariant}}">search</span><input placeholder="Search deleted items" aria-label="Search deleted items" style="flex:1;border:0;background:transparent;outline:0;font-size:16px"></label>
<button type="button" style="{{btnRegex}}"><span class="ms" aria-hidden="true" style="font-size:18px">regular_expression</span>Regex</button>
<button type="button" style="{{btnError}}"><span class="ms" aria-hidden="true" style="font-size:18px">delete_forever</span>Empty Recycle Bin</button>
</header>
<section aria-label="Retention note" style="display:flex;align-items:center;gap:16px;border-radius:12px;background:{{tertiaryContainer}};color:{{onTertiaryContainer}};padding:16px 20px;animation:enter 320ms cubic-bezier(.05,.7,.1,1) both">
<span class="ms fill" aria-hidden="true">info</span>
<div style="flex:1"><div style="font-size:16px;line-height:24px;font-weight:500">Items stay for 30 days</div><div>After that they are removed for good, and their encrypted storage space is freed.</div></div>
<button type="button" style="{{btnTextOn}}"><span class="ms" aria-hidden="true" style="font-size:18px">settings</span>Change</button>
</section>
<section aria-label="Deleted items" style="flex:1;min-height:0;border-radius:12px;background:{{surfaceContainerHighest}};overflow:hidden;display:flex;flex-direction:column">
<div style="display:grid;grid-template-columns:40px minmax(0,1.4fr) minmax(0,1fr) 150px 110px 300px;gap:12px;align-items:center;height:40px;padding:0 16px;color:{{onSurfaceVariant}};font-weight:500;border-bottom:1px solid {{outlineVariant}}"><span></span><span>Name</span><span>Original folder</span><span>Deleted</span><span>Time left</span><span></span></div>
<div role="list" style="flex:1;overflow:hidden">
<sc-for list="{{rows}}" as="f" hint-placeholder-count="9">
<div role="listitem" style="{{f.row}}">
<button type="button" role="checkbox" aria-checked="{{f.checked}}" aria-label="Select {{f.name}}" onClick="{{f.pick}}" style="{{iconBtn}}"><span class="ms" aria-hidden="true">{{f.box}}</span></button>
<span style="display:flex;align-items:center;gap:12px;min-width:0"><span class="ms" aria-hidden="true" style="color:{{onSurfaceVariant}}">{{f.icon}}</span><span style="font-size:16px;line-height:24px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{f.name}}</span></span>
<span style="color:{{onSurfaceVariant}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{f.from}}</span>
<span style="color:{{onSurfaceVariant}}">{{f.deleted}}</span>
<span style="color:{{onSurfaceVariant}}">{{f.left}}</span>
<span style="display:flex;justify-content:flex-end;gap:4px">
<button type="button" style="{{btnText}}"><span class="ms" aria-hidden="true" style="font-size:18px">restore_from_trash</span>Restore</button>
<button type="button" style="{{btnTextError}}"><span class="ms" aria-hidden="true" style="font-size:18px">delete_forever</span>Delete permanently</button>
</span>
</div>
</sc-for>
</div>
<div style="display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-top:1px solid {{outlineVariant}}"><span style="flex:1;color:{{onSurfaceVariant}}">{{selectedText}}</span><button type="button" style="{{btnTonal}}"><span class="ms" aria-hidden="true" style="font-size:18px">restore_from_trash</span>Restore selected</button></div>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seed":{"editor":"enum","options":["green","indigo","amber"],"default":"green"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"motion":{"editor":"enum","options":["on","off"],"default":"on"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { picked: { 1: true, 4: true } }; }
  renderVals() {
    const t = scheme(this.props.seed ?? 'green', this.props.theme ?? 'dark');
    const u = ui(t, 1);
    const data = [
      ['picture_as_pdf','Old contract.pdf','Studio','Today 17:42','30 days'],
      ['folder','Old drafts','Studio','Today 09:30','30 days'],
      ['image','Logo-draft.svg','Studio · Brand','Yesterday 14:05','29 days'],
      ['description','Meeting minutes.docx','Work','Yesterday 10:21','29 days'],
      ['movie','Raw footage 04.mp4','Studio · Video','14 Nov 18:12','26 days'],
      ['table_chart','Timesheets 2025.xlsx','Work','12 Nov 08:48','24 days'],
      ['audio_file','Voiceover take 1.wav','Studio · Audio','10 Nov 20:33','22 days'],
      ['slideshow','Pitch v1.pptx','Work','6 Nov 15:50','18 days'],
      ['archive','Backup 2025.zip','Taxes','28 Oct 11:09','10 days']
    ];
    const p = this.state.picked;
    const n = Object.keys(p).filter(k => p[k]).length;
    return { ...t, ...u, motion: this.props.motion ?? 'on',
      btnTextOn: u.btnText.replace(t.primary, t.onTertiaryContainer),
      selectedText: n + ' selected',
      rows: data.map(([icon, name, from, deleted, left], i) => ({ icon, name, from, deleted, left, checked: String(!!p[i]), box: p[i] ? 'check_box' : 'check_box_outline_blank',
        pick: () => this.setState({ picked: { ...p, [i]: !p[i] } }),
        row: 'display:grid;grid-template-columns:40px minmax(0,1.4fr) minmax(0,1fr) 150px 110px 300px;gap:12px;align-items:center;height:56px;padding:0 16px;border-bottom:1px solid ' + t.outlineVariant + ';background:' + (p[i] ? t.secondaryContainer : 'transparent') }))
    };
  }
}
function ui(t, selected) {
  const railDefs = [['Home','home'],['Drives','hard_drive'],['Offline','offline_pin'],['History','history'],['Backup','cloud_upload'],['Shared','share'],['Tools','build'],['Settings','settings']];
  const B = (bg, fg, border, pad, extra) => 'height:40px;padding:' + (pad || '0 24px 0 16px') + ';border-radius:999px;border:' + (border || '0') + ';background:' + bg + ';color:' + fg + ';display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;cursor:pointer;white-space:nowrap;' + (extra || '');
  return {
    rail: railDefs.map(([label, icon], i) => ({ label, icon, iconClass: i === selected ? 'ms fill' : 'ms', color: i === selected ? t.onSurface : t.onSurfaceVariant,
      pill: 'width:56px;height:32px;border-radius:16px;display:grid;place-items:center;background:' + (i === selected ? t.secondaryContainer : 'transparent') + ';color:' + (i === selected ? t.onSecondaryContainer : 'inherit') })),
    btnTonal: B(t.secondaryContainer, t.onSecondaryContainer), btnText: B('transparent', t.primary, '0', '0 12px 0 8px'), btnTextError: B('transparent', t.error, '0', '0 12px 0 8px'),
    btnError: B('transparent', t.error, '1px solid ' + t.error),
    btnRegex: B(t.secondaryContainer, t.onSecondaryContainer, '0', '0 16px 0 12px'),
    iconBtn: 'width:40px;height:40px;border-radius:999px;border:0;background:transparent;color:' + t.onSurfaceVariant + ';display:grid;place-items:center;cursor:pointer',
    searchBox: 'display:flex;align-items:center;gap:12px;width:360px;height:56px;border-radius:999px;background:' + t.surfaceContainerHigh + ';padding:0 8px 0 16px'
  };
}
function scheme(seed, theme) {
  const dark = theme !== 'light';
  const seeds = {
    green:  dark ? { primary:'#8FD6B0', onPrimary:'#003825', primaryContainer:'#00513A', onPrimaryContainer:'#AAF2CB', secondaryContainer:'#354B40', onSecondaryContainer:'#CFE9D9', tertiaryContainer:'#234C5D', onTertiaryContainer:'#C1E8FB' }
                 : { primary:'#2B6A4E', onPrimary:'#FFFFFF', primaryContainer:'#AFF1CE', onPrimaryContainer:'#002114', secondaryContainer:'#CFE9D9', onSecondaryContainer:'#0B1F15', tertiaryContainer:'#C1E8FB', onTertiaryContainer:'#001F2A' },
    indigo: dark ? { primary:'#B9C3FF', onPrimary:'#1F2C61', primaryContainer:'#364379', onPrimaryContainer:'#DDE1FF', secondaryContainer:'#424659', onSecondaryContainer:'#DFE1F9', tertiaryContainer:'#5C3D58', onTertiaryContainer:'#FFD6F7' }
                 : { primary:'#4D5C92', onPrimary:'#FFFFFF', primaryContainer:'#DDE1FF', onPrimaryContainer:'#05164B', secondaryContainer:'#DFE1F9', onSecondaryContainer:'#171B2C', tertiaryContainer:'#FFD6F7', onTertiaryContainer:'#2C1229' },
    amber:  dark ? { primary:'#F5BD6F', onPrimary:'#452B00', primaryContainer:'#633F00', onPrimaryContainer:'#FFDDB3', secondaryContainer:'#574431', onSecondaryContainer:'#FBDEBC', tertiaryContainer:'#3E4E2E', onTertiaryContainer:'#D5EDBA' }
                 : { primary:'#835416', onPrimary:'#FFFFFF', primaryContainer:'#FFDDB3', onPrimaryContainer:'#2A1700', secondaryContainer:'#FBDEBC', onSecondaryContainer:'#271904', tertiaryContainer:'#D5EDBA', onTertiaryContainer:'#11200A' }
  };
  const neutral = dark
    ? { surface:'#101413', surfaceContainerLowest:'#0B0F0E', surfaceContainerLow:'#181D1B', surfaceContainer:'#1C211F', surfaceContainerHigh:'#272B29', surfaceContainerHighest:'#313634', onSurface:'#E0E3E0', onSurfaceVariant:'#C0C9C3', outline:'#8A938D', outlineVariant:'#404944', error:'#FFB4AB', onError:'#690005', errorContainer:'#93000A', onErrorContainer:'#FFDAD6', inverseSurface:'#E0E3E0', inverseOnSurface:'#2D3130', scrim:'rgba(0,0,0,.5)', shadow:'rgba(0,0,0,.45)' }
    : { surface:'#F7FAF7', surfaceContainerLowest:'#FFFFFF', surfaceContainerLow:'#F1F4F1', surfaceContainer:'#EBEFEB', surfaceContainerHigh:'#E6E9E6', surfaceContainerHighest:'#E0E3E0', onSurface:'#191C1B', onSurfaceVariant:'#404944', outline:'#707973', outlineVariant:'#C0C9C3', error:'#BA1A1A', onError:'#FFFFFF', errorContainer:'#FFDAD6', onErrorContainer:'#410002', inverseSurface:'#2D3130', inverseOnSurface:'#EEF1EE', scrim:'rgba(0,0,0,.32)', shadow:'rgba(0,0,0,.18)' };
  return { ...neutral, ...(seeds[seed] || seeds.green) };
}
</script>
</body>
</html>
