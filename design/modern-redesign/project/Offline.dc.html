<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Available offline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';user-select:none}
.ms.fill{font-variation-settings:'FILL' 1}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
[data-motion=off] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,select{font:inherit;color:inherit}
</style>
</helmet>
<div data-motion="{{motion}}" style="width:1440px;height:960px;display:flex;font-family:'Roboto Flex',system-ui,sans-serif;font-size:14px;line-height:20px;color:{{onSurface}};background:{{surface}};overflow:hidden">
<nav aria-label="Sections" style="flex:0 0 96px;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:24px">
<button type="button" aria-label="Keep a file offline" style="width:56px;height:56px;border-radius:16px;border:0;background:{{primaryContainer}};color:{{onPrimaryContainer}};display:grid;place-items:center;margin-bottom:16px;box-shadow:0 2px 6px {{shadow}}"><span class="ms" aria-hidden="true">offline_pin</span></button>
<sc-for list="{{rail}}" as="r" hint-placeholder-count="8">
<a href="#" style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:{{r.color}};width:80px"><span style="{{r.pill}}"><span class="{{r.iconClass}}" aria-hidden="true">{{r.icon}}</span></span><span style="font-size:12px;line-height:16px;font-weight:500">{{r.label}}</span></a>
</sc-for>
</nav>
<main style="flex:1;padding:24px 24px 24px 0;display:flex;min-width:0">
<div style="flex:1;border-radius:28px;background:{{surfaceContainerLow}};padding:24px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:hidden">
<header style="display:flex;align-items:center;gap:12px">
<div style="flex:1"><h1 style="margin:0;font-size:32px;line-height:40px;font-weight:400">Available offline</h1><p style="margin:4px 0 0;color:{{onSurfaceVariant}};font-size:16px;line-height:24px">Files you can open without a connection</p></div>
<label style="{{searchBox}}"><span class="ms" aria-hidden="true" style="color:{{onSurfaceVariant}}">search</span><input placeholder="Search offline files" aria-label="Search offline files" style="flex:1;border:0;background:transparent;outline:0;font-size:16px"></label>
<button type="button" style="{{btnRegex}}"><span class="ms" aria-hidden="true" style="font-size:18px">regular_expression</span>Regex</button>
</header>
<section aria-label="Summary" style="display:flex;align-items:center;gap:24px;border-radius:28px;background:{{primaryContainer}};color:{{onPrimaryContainer}};padding:24px 32px;animation:enter 320ms cubic-bezier(.05,.7,.1,1) both">
<span style="width:72px;height:72px;border-radius:24px;display:grid;place-items:center;background:{{primary}};color:{{onPrimary}}"><span class="ms fill" aria-hidden="true" style="font-size:40px">offline_pin</span></span>
<div style="flex:1"><div style="font-size:36px;line-height:44px">12 files</div><div style="font-size:16px;line-height:24px">1.4 GB kept on this PC</div></div>
<div style="flex:0 0 320px"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Offline storage</span><span style="font-weight:500">1.4 of 10 GB</span></div><div aria-hidden="true" style="height:4px;border-radius:999px;background:{{secondaryContainer}};overflow:hidden"><div style="width:14%;height:100%;background:{{primary}};border-radius:999px"></div></div></div>
<button type="button" style="{{btnTonal}}"><span class="ms" aria-hidden="true" style="font-size:18px">sync</span>Update all</button>
<button type="button" style="{{btnOutlinedOn}}"><span class="ms" aria-hidden="true" style="font-size:18px">cloud_off</span>Remove all</button>
</section>
<div style="display:flex;align-items:center;gap:16px">
<div role="group" aria-label="Filter by drive" style="display:flex;height:40px;border-radius:999px;border:1px solid {{outline}};overflow:hidden">
<sc-for list="{{segs}}" as="g" hint-placeholder-count="3">
<button type="button" onClick="{{g.pick}}" aria-pressed="{{g.pressed}}" style="{{g.style}}"><span class="ms" aria-hidden="true" style="{{g.checkStyle}}">check</span>{{g.label}}</button>
</sc-for>
</div>
<span style="flex:1;color:{{onSurfaceVariant}}">{{count}}</span>
<button type="button" style="{{btnText}}"><span class="ms" aria-hidden="true" style="font-size:18px">sort</span>Sort by name</button>
</div>
<section aria-label="Offline files" style="flex:1;min-height:0;border-radius:12px;background:{{surfaceContainerHighest}};overflow:hidden">
<div role="list" style="display:flex;flex-direction:column">
<sc-for list="{{rows}}" as="f" hint-placeholder-count="9">
<div role="listitem" style="display:flex;align-items:center;gap:16px;height:64px;padding:0 8px 0 16px;border-bottom:1px solid {{outlineVariant}}">
<span style="width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:{{surfaceContainerHigh}};color:{{onSurfaceVariant}}"><span class="ms" aria-hidden="true" style="font-size:20px">{{f.icon}}</span></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:16px;line-height:24px;font-weight:500">{{f.name}}</span><span style="display:block;color:{{onSurfaceVariant}}">{{f.drive}} · {{f.size}}</span></span>
<span style="display:flex;align-items:center;gap:6px;color:{{onSurfaceVariant}}"><span class="ms fill" aria-hidden="true" style="font-size:18px;color:{{primary}}">offline_pin</span>Updated {{f.time}}</span>
<button type="button" aria-label="Remove offline copy of {{f.name}}" style="{{iconBtn}}"><span class="ms" aria-hidden="true">cloud_off</span></button>
</div>
</sc-for>
</div>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seed":{"editor":"enum","options":["green","indigo","amber"],"default":"green"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"motion":{"editor":"enum","options":["on","off"],"default":"on"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { seg: 'All' }; }
  renderVals() {
    const t = scheme(this.props.seed ?? 'green', this.props.theme ?? 'dark');
    const u = ui(t, 2);
    const all = [
      ['picture_as_pdf','Quarterly report.pdf','Studio','4.2 MB','19:12'],
      ['slideshow','Brand guidelines.pptx','Studio','38.6 MB','16:40'],
      ['table_chart','Budget 2026.xlsx','Work','640 KB','08:48'],
      ['description','Interview notes.docx','Studio','86 KB','21:30'],
      ['picture_as_pdf','Contract.pdf','Work','1.1 MB','11:02'],
      ['image','Logo-final.svg','Studio','212 KB','09:15'],
      ['folder','Invoices 2026','Work','86 MB','Yesterday'],
      ['movie','Demo reel.mp4','Studio','512 MB','Yesterday'],
      ['description','Meeting minutes.docx','Work','54 KB','Mon'],
      ['audio_file','Voiceover take 3.wav','Studio','184 MB','Mon'],
      ['table_chart','Timesheets.xlsx','Work','320 KB','Sun'],
      ['picture_as_pdf','Style guide.pdf','Studio','12.4 MB','Sat']
    ];
    const s = this.state.seg;
    const list = all.filter(r => s === 'All' || r[2] === s);
    return { ...t, ...u, motion: this.props.motion ?? 'on',
      btnOutlinedOn: u.btnOutlined.replace(t.primary, t.onPrimaryContainer),
      count: 'Showing ' + list.length + ' of 12 files',
      segs: ['All','Studio','Work'].map((label, i) => { const on = s === label; return { label, pressed: String(on), pick: () => this.setState({ seg: label }),
        checkStyle: 'font-size:18px;display:' + (on ? 'inline-block' : 'none'),
        style: 'height:40px;padding:0 20px;border:0;border-left:' + (i ? '1px solid ' + t.outline : '0') + ';display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer;background:' + (on ? t.secondaryContainer : 'transparent') + ';color:' + (on ? t.onSecondaryContainer : t.onSurface) }; }),
      rows: list.map(([icon, name, drive, size, time]) => ({ icon, name, drive, size, time }))
    };
  }
}
function ui(t, selected) {
  const railDefs = [['Home','home'],['Drives','hard_drive'],['Offline','offline_pin'],['History','history'],['Backup','cloud_upload'],['Shared','share'],['Tools','build'],['Settings','settings']];
  const B = (bg, fg, border, pad, extra) => 'height:40px;padding:' + (pad || '0 24px 0 16px') + ';border-radius:999px;border:' + (border || '0') + ';background:' + bg + ';color:' + fg + ';display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;cursor:pointer;white-space:nowrap;' + (extra || '');
  return {
    rail: railDefs.map(([label, icon], i) => ({ label, icon, iconClass: i === selected ? 'ms fill' : 'ms', color: i === selected ? t.onSurface : t.onSurfaceVariant,
      pill: 'width:56px;height:32px;border-radius:16px;display:grid;place-items:center;background:' + (i === selected ? t.secondaryContainer : 'transparent') + ';color:' + (i === selected ? t.onSecondaryContainer : 'inherit') })),
    btnTonal: B(t.secondaryContainer, t.onSecondaryContainer), btnOutlined: B('transparent', t.primary, '1px solid ' + t.outline), btnText: B('transparent', t.primary, '0', '0 12px'),
    btnRegex: B(t.secondaryContainer, t.onSecondaryContainer, '0', '0 16px 0 12px'),
    iconBtn: 'width:40px;height:40px;border-radius:999px;border:0;background:transparent;color:' + t.onSurfaceVariant + ';display:grid;place-items:center;cursor:pointer',
    searchBox: 'display:flex;align-items:center;gap:12px;width:420px;height:56px;border-radius:999px;background:' + t.surfaceContainerHigh + ';padding:0 8px 0 16px'
  };
}
function scheme(seed, theme) {
  const dark = theme !== 'light';
  const seeds = {
    green:  dark ? { primary:'#8FD6B0', onPrimary:'#003825', primaryContainer:'#00513A', onPrimaryContainer:'#AAF2CB', secondaryContainer:'#354B40', onSecondaryContainer:'#CFE9D9', tertiaryContainer:'#234C5D', onTertiaryContainer:'#C1E8FB' }
                 : { primary:'#2B6A4E', onPrimary:'#FFFFFF', primaryContainer:'#AFF1CE', onPrimaryContainer:'#002114', secondaryContainer:'#CFE9D9', onSecondaryContainer:'#0B1F15', tertiaryContainer:'#C1E8FB', onTertiaryContainer:'#001F2A' },
    indigo: dark ? { primary:'#B9C3FF', onPrimary:'#1F2C61', primaryContainer:'#364379', onPrimaryContainer:'#DDE1FF', secondaryContainer:'#424659', onSecondaryContainer:'#DFE1F9', tertiaryContainer:'#5C3D58', onTertiaryContainer:'#FFD6F7' }
                 : { primary:'#4D5C92', onPrimary:'#FFFFFF', primaryContainer:'#DDE1FF', onPrimaryContainer:'#05164B', secondaryContainer:'#DFE1F9', onSecondaryContainer:'#171B2C', tertiaryContainer:'#FFD6F7', onTertiaryContainer:'#2C1229' },
    amber:  dark ? { primary:'#F5BD6F', onPrimary:'#452B00', primaryContainer:'#633F00', onPrimaryContainer:'#FFDDB3', secondaryContainer:'#574431', onSecondaryContainer:'#FBDEBC', tertiaryContainer:'#3E4E2E', onTertiaryContainer:'#D5EDBA' }
                 : { primary:'#835416', onPrimary:'#FFFFFF', primaryContainer:'#FFDDB3', onPrimaryContainer:'#2A1700', secondaryContainer:'#FBDEBC', onSecondaryContainer:'#271904', tertiaryContainer:'#D5EDBA', onTertiaryContainer:'#11200A' }
  };
  const neutral = dark
    ? { surface:'#101413', surfaceContainerLowest:'#0B0F0E', surfaceContainerLow:'#181D1B', surfaceContainer:'#1C211F', surfaceContainerHigh:'#272B29', surfaceContainerHighest:'#313634', onSurface:'#E0E3E0', onSurfaceVariant:'#C0C9C3', outline:'#8A938D', outlineVariant:'#404944', error:'#FFB4AB', onError:'#690005', errorContainer:'#93000A', onErrorContainer:'#FFDAD6', inverseSurface:'#E0E3E0', inverseOnSurface:'#2D3130', scrim:'rgba(0,0,0,.5)', shadow:'rgba(0,0,0,.45)' }
    : { surface:'#F7FAF7', surfaceContainerLowest:'#FFFFFF', surfaceContainerLow:'#F1F4F1', surfaceContainer:'#EBEFEB', surfaceContainerHigh:'#E6E9E6', surfaceContainerHighest:'#E0E3E0', onSurface:'#191C1B', onSurfaceVariant:'#404944', outline:'#707973', outlineVariant:'#C0C9C3', error:'#BA1A1A', onError:'#FFFFFF', errorContainer:'#FFDAD6', onErrorContainer:'#410002', inverseSurface:'#2D3130', inverseOnSurface:'#EEF1EE', scrim:'rgba(0,0,0,.32)', shadow:'rgba(0,0,0,.18)' };
  return { ...neutral, ...(seeds[seed] || seeds.green) };
}
</script>
</body>
</html>
