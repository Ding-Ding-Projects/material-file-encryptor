<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone Drive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';user-select:none}
.ms.fill{font-variation-settings:'FILL' 1}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
[data-motion=off] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,select{font:inherit;color:inherit}
.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div data-motion="{{motion}}" style="width:390px;height:844px;position:relative;display:flex;flex-direction:column;font-family:'Roboto Flex',system-ui,sans-serif;font-size:14px;line-height:20px;color:{{onSurface}};background:{{surface}};overflow:hidden">
<header style="flex:0 0 64px;display:flex;align-items:center;gap:4px;padding:0 4px">
<button type="button" aria-label="Back" style="width:48px;height:48px;border-radius:999px;border:0;background:transparent;color:{{onSurface}};display:grid;place-items:center"><span class="ms" aria-hidden="true">arrow_back</span></button>
<div style="flex:1;min-width:0"><h1 style="margin:0;font-size:22px;line-height:28px;font-weight:400">Studio</h1><span style="color:{{onSurfaceVariant}};font-size:12px;line-height:16px">Q: · unlocked · 2.8 GB</span></div>
<button type="button" aria-label="Search files" style="width:48px;height:48px;border-radius:999px;border:0;background:transparent;color:{{onSurfaceVariant}};display:grid;place-items:center"><span class="ms" aria-hidden="true">search</span></button>
<button type="button" aria-label="More options" style="width:48px;height:48px;border-radius:999px;border:0;background:transparent;color:{{onSurfaceVariant}};display:grid;place-items:center"><span class="ms" aria-hidden="true">more_vert</span></button>
</header>
<div class="scroll" role="group" aria-label="Filter files" style="flex:0 0 48px;display:flex;align-items:center;gap:8px;padding:0 16px;overflow-x:auto">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><button type="button" onClick="{{c.pick}}" style="{{c.style}}"><span class="ms" aria-hidden="true" style="font-size:18px;{{c.checkStyle}}">check</span>{{c.label}}</button></sc-for>
</div>
<main class="scroll" style="flex:1;overflow:auto;min-height:0">
<sc-for list="{{files}}" as="f" hint-placeholder-count="7">
<button type="button" onClick="{{f.pick}}" style="{{f.row}}"><span aria-hidden="true" style="{{f.icon}}"><span class="ms" aria-hidden="true">{{f.symbol}}</span></span><span style="flex:1;min-width:0;text-align:left"><span style="display:block;font-size:16px;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{f.name}}</span><span style="color:{{onSurfaceVariant}}">{{f.meta}}</span></span><span class="ms" aria-hidden="true" style="color:{{onSurfaceVariant}};{{f.pinStyle}}">offline_pin</span><span class="ms" aria-hidden="true" style="color:{{onSurfaceVariant}}">more_vert</span></button>
</sc-for>
</main>
<nav aria-label="Main" style="flex:0 0 80px;display:flex;background:{{surfaceContainer}};padding:12px 8px 16px;box-sizing:border-box">
<sc-for list="{{tabs}}" as="n" hint-placeholder-count="4">
<a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:{{n.color}}"><span style="{{n.pill}}"><span class="{{n.iconClass}}" aria-hidden="true">{{n.icon}}</span></span><span style="font-size:12px;line-height:16px;font-weight:500">{{n.label}}</span></a>
</sc-for>
</nav>
<div style="{{scrimStyle}}" onClick="{{closeSheet}}" aria-hidden="true"></div>
<section role="dialog" aria-label="File actions" style="{{sheetStyle}}">
<div aria-hidden="true" style="width:32px;height:4px;border-radius:999px;background:{{onSurfaceVariant}};opacity:.4;margin:0 auto 12px"></div>
<div style="display:flex;align-items:center;gap:16px;min-height:56px;padding:0 8px 8px;border-bottom:1px solid {{outlineVariant}}">
<span aria-hidden="true" style="width:40px;height:40px;border-radius:12px;background:{{tertiaryContainer}};color:{{onTertiaryContainer}};display:grid;place-items:center"><span class="ms" aria-hidden="true">{{selIcon}}</span></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:16px;line-height:24px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{selName}}</span><span style="color:{{onSurfaceVariant}}">{{selMeta}}</span></span>
</div>
<sc-for list="{{actions}}" as="a" hint-placeholder-count="5">
<button type="button" style="display:flex;align-items:center;gap:16px;width:100%;min-height:52px;padding:0 8px;border:0;border-radius:12px;background:transparent;text-align:left;font-size:16px;line-height:24px;color:{{a.color}}"><span class="ms" aria-hidden="true">{{a.icon}}</span><span style="flex:1">{{a.label}}</span></button>
</sc-for>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seed":{"editor":"enum","options":["green","indigo","amber"],"default":"green"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"motion":{"editor":"enum","options":["on","off"],"default":"on"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { sel: 0, filter: 'all' }; }
  renderVals() {
    const t = scheme(this.props.seed ?? 'green', this.props.theme ?? 'dark');
    const s = this.state;
    const SEL = 1;
    const tabDefs = [['Home','home'],['Drives','hard_drive'],['Backup','cloud_upload'],['Settings','settings']];
    const fileDefs = [
      { name:'Quarterly report.pdf', meta:'2.4 MB · today 18:05', symbol:'picture_as_pdf', kind:'docs', pin:true },
      { name:'Brand guidelines', meta:'Folder · 14 items', symbol:'folder', kind:'docs', pin:false },
      { name:'Cover photo.jpg', meta:'3.1 MB · yesterday 21:40', symbol:'image', kind:'images', pin:false },
      { name:'Launch teaser.mp4', meta:'148 MB · 15 Nov, 11:12', symbol:'movie', kind:'video', pin:false },
      { name:'Invoice 2041.pdf', meta:'88 KB · 14 Nov, 09:30', symbol:'picture_as_pdf', kind:'docs', pin:true },
      { name:'Team photo.png', meta:'5.6 MB · 12 Nov, 16:02', symbol:'image', kind:'images', pin:false },
      { name:'Notes.txt', meta:'4 KB · 10 Nov, 08:15', symbol:'description', kind:'docs', pin:false }
    ];
    const chipDefs = [['all','All'],['docs','Documents'],['images','Images'],['video','Video'],['offline','Offline']];
    const shown = fileDefs.map((f, i) => ({ ...f, i })).filter(f => s.filter === 'all' || f.kind === s.filter || (s.filter === 'offline' && f.pin));
    const cur = fileDefs[s.sel] || fileDefs[0];
    const open = s.sel >= 0;
    return { ...t, motion: this.props.motion ?? 'on',
      tabs: tabDefs.map(([label, icon], i) => ({ label, icon, iconClass: i === SEL ? 'ms fill' : 'ms', color: i === SEL ? t.onSurface : t.onSurfaceVariant,
        pill: 'width:64px;height:32px;border-radius:16px;display:grid;place-items:center;background:' + (i === SEL ? t.secondaryContainer : 'transparent') + ';color:' + (i === SEL ? t.onSecondaryContainer : 'inherit') })),
      chips: chipDefs.map(([id, label]) => { const on = s.filter === id; return { label, pick: () => this.setState({ filter: id }), checkStyle: on ? '' : 'display:none',
        style: 'flex:0 0 auto;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 ' + (on ? '8px' : '12px') + ';border-radius:8px;cursor:pointer;font-weight:500;background:' + (on ? t.secondaryContainer : 'transparent') + ';border:' + (on ? '0' : '1px solid ' + t.outlineVariant) + ';color:' + (on ? t.onSecondaryContainer : t.onSurface) }; }),
      files: shown.map(f => { const on = s.sel === f.i; return { name: f.name, meta: f.meta, symbol: f.symbol, pick: () => this.setState({ sel: f.i }),
        pinStyle: f.pin ? '' : 'display:none',
        row: 'display:flex;align-items:center;gap:16px;width:100%;min-height:72px;padding:0 16px;border:0;cursor:pointer;background:' + (on ? t.secondaryContainer : 'transparent') + ';color:' + t.onSurface,
        icon: 'width:40px;height:40px;border-radius:' + (f.symbol === 'folder' ? '12px' : '999px') + ';display:grid;place-items:center;flex:0 0 40px;background:' + (on ? t.surface : t.primaryContainer) + ';color:' + t.onPrimaryContainer }; }),
      scrimStyle: 'position:absolute;inset:0;background:' + t.scrim + ';' + (open ? '' : 'display:none;'),
      closeSheet: () => this.setState({ sel: -1 }),
      sheetStyle: 'position:absolute;left:0;right:0;bottom:0;border-radius:28px 28px 0 0;background:' + t.surfaceContainerLow + ';padding:12px 16px 24px;box-shadow:0 -2px 12px ' + t.shadow + ';animation:rise 240ms cubic-bezier(.05,.7,.1,1) both;' + (open ? '' : 'display:none;'),
      selName: cur.name, selMeta: cur.meta, selIcon: cur.symbol,
      actions: [['open_in_new','Open',0],['share','Share',0],['offline_pin','Keep offline',0],['history','All versions',0],['delete','Delete',1]].map(([icon, label, bad]) => ({ icon, label, color: bad ? t.error : t.onSurface }))
    };
  }
}
function scheme(seed, theme) {
  const dark = theme !== 'light';
  const seeds = {
    green:  dark ? { primary:'#8FD6B0', onPrimary:'#003825', primaryContainer:'#00513A', onPrimaryContainer:'#AAF2CB', secondaryContainer:'#354B40', onSecondaryContainer:'#CFE9D9', tertiaryContainer:'#234C5D', onTertiaryContainer:'#C1E8FB' }
                 : { primary:'#2B6A4E', onPrimary:'#FFFFFF', primaryContainer:'#AFF1CE', onPrimaryContainer:'#002114', secondaryContainer:'#CFE9D9', onSecondaryContainer:'#0B1F15', tertiaryContainer:'#C1E8FB', onTertiaryContainer:'#001F2A' },
    indigo: dark ? { primary:'#B9C3FF', onPrimary:'#1F2C61', primaryContainer:'#364379', onPrimaryContainer:'#DDE1FF', secondaryContainer:'#424659', onSecondaryContainer:'#DFE1F9', tertiaryContainer:'#5C3D58', onTertiaryContainer:'#FFD6F7' }
                 : { primary:'#4D5C92', onPrimary:'#FFFFFF', primaryContainer:'#DDE1FF', onPrimaryContainer:'#05164B', secondaryContainer:'#DFE1F9', onSecondaryContainer:'#171B2C', tertiaryContainer:'#FFD6F7', onTertiaryContainer:'#2C1229' },
    amber:  dark ? { primary:'#F5BD6F', onPrimary:'#452B00', primaryContainer:'#633F00', onPrimaryContainer:'#FFDDB3', secondaryContainer:'#574431', onSecondaryContainer:'#FBDEBC', tertiaryContainer:'#3E4E2E', onTertiaryContainer:'#D5EDBA' }
                 : { primary:'#835416', onPrimary:'#FFFFFF', primaryContainer:'#FFDDB3', onPrimaryContainer:'#2A1700', secondaryContainer:'#FBDEBC', onSecondaryContainer:'#271904', tertiaryContainer:'#D5EDBA', onTertiaryContainer:'#11200A' }
  };
  const neutral = dark
    ? { surface:'#101413', surfaceContainerLowest:'#0B0F0E', surfaceContainerLow:'#181D1B', surfaceContainer:'#1C211F', surfaceContainerHigh:'#272B29', surfaceContainerHighest:'#313634', onSurface:'#E0E3E0', onSurfaceVariant:'#C0C9C3', outline:'#8A938D', outlineVariant:'#404944', error:'#FFB4AB', onError:'#690005', errorContainer:'#93000A', onErrorContainer:'#FFDAD6', inverseSurface:'#E0E3E0', inverseOnSurface:'#2D3130', scrim:'rgba(0,0,0,.5)', shadow:'rgba(0,0,0,.45)' }
    : { surface:'#F7FAF7', surfaceContainerLowest:'#FFFFFF', surfaceContainerLow:'#F1F4F1', surfaceContainer:'#EBEFEB', surfaceContainerHigh:'#E6E9E6', surfaceContainerHighest:'#E0E3E0', onSurface:'#191C1B', onSurfaceVariant:'#404944', outline:'#707973', outlineVariant:'#C0C9C3', error:'#BA1A1A', onError:'#FFFFFF', errorContainer:'#FFDAD6', onErrorContainer:'#410002', inverseSurface:'#2D3130', inverseOnSurface:'#EEF1EE', scrim:'rgba(0,0,0,.32)', shadow:'rgba(0,0,0,.18)' };
  return { ...neutral, ...(seeds[seed] || seeds.green) };
}
</script>
</body>
</html>
