<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';user-select:none}
.ms.fill{font-variation-settings:'FILL' 1}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
[data-motion=off] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,select{font:inherit;color:inherit}
</style>
</helmet>
<div data-motion="{{motion}}" style="width:1440px;height:960px;display:flex;font-family:'Roboto Flex',system-ui,sans-serif;font-size:14px;line-height:20px;color:{{onSurface}};background:{{surface}};overflow:hidden">
<nav aria-label="Sections" style="flex:0 0 96px;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:24px">
<button type="button" aria-label="Restore a file" style="width:56px;height:56px;border-radius:16px;border:0;background:{{primaryContainer}};color:{{onPrimaryContainer}};display:grid;place-items:center;margin-bottom:16px;box-shadow:0 2px 6px {{shadow}}"><span class="ms" aria-hidden="true">restore</span></button>
<sc-for list="{{rail}}" as="r" hint-placeholder-count="8">
<a href="#" style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:{{r.color}};width:80px"><span style="{{r.pill}}"><span class="{{r.iconClass}}" aria-hidden="true">{{r.icon}}</span></span><span style="font-size:12px;line-height:16px;font-weight:500">{{r.label}}</span></a>
</sc-for>
</nav>
<main style="flex:1;padding:24px 24px 24px 0;display:flex;min-width:0">
<div style="flex:1;border-radius:28px;background:{{surfaceContainerLow}};padding:24px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:hidden">
<header style="display:flex;align-items:center;gap:12px">
<div style="flex:1"><h1 style="margin:0;font-size:32px;line-height:40px;font-weight:400">History</h1><p style="margin:4px 0 0;color:{{onSurfaceVariant}};font-size:16px;line-height:24px">Every version and change across your drives</p></div>
<label style="{{searchBox}}"><span class="ms" aria-hidden="true" style="color:{{onSurfaceVariant}}">search</span><input placeholder="Search history" aria-label="Search history" style="flex:1;border:0;background:transparent;outline:0;font-size:16px"></label>
<button type="button" style="{{btnRegex}}"><span class="ms" aria-hidden="true" style="font-size:18px">regular_expression</span>Regex</button>
</header>
<div role="group" aria-label="Filter activity" style="display:flex;align-items:center;gap:8px">
<span style="color:{{onSurfaceVariant}};display:flex;align-items:center;gap:8px;margin-right:4px"><span class="ms" aria-hidden="true" style="font-size:20px">filter_list</span>Show</span>
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}"><span class="ms" aria-hidden="true" style="{{c.iconStyle}}">{{c.icon}}</span>{{c.label}}</button>
</sc-for>
</div>
<div style="flex:1;display:flex;gap:16px;min-height:0">
<section aria-label="Timeline" style="flex:1;min-width:0;border-radius:12px;background:{{surfaceContainerHighest}};padding:8px 8px 0;overflow:hidden">
<sc-for list="{{entries}}" as="e" hint-placeholder-count="9">
<div style="{{e.wrap}}">
<h2 style="{{e.headStyle}}">{{e.head}}</h2>
<div style="{{e.rowStyle}}">
<button type="button" onClick="{{e.pick}}" aria-pressed="{{e.pressed}}" style="{{e.mainStyle}}">
<span style="{{e.iconBox}}"><span class="ms" aria-hidden="true" style="font-size:20px">{{e.icon}}</span></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:16px;line-height:24px;font-weight:500">{{e.file}}</span><span style="display:block;color:{{onSurfaceVariant}}">{{e.change}}</span></span>
<span style="color:{{onSurfaceVariant}}">{{e.time}}</span>
</button>
<button type="button" style="{{btnText}}"><span class="ms" aria-hidden="true" style="font-size:18px">restore</span>Restore</button>
</div>
</div>
</sc-for>
</section>
<aside aria-label="Version preview" style="flex:0 0 380px;border-radius:12px;border:1px solid {{outlineVariant}};padding:20px;display:flex;flex-direction:column;gap:16px">
<div style="font-size:12px;line-height:16px;font-weight:500;color:{{onSurfaceVariant}}">Version preview</div>
<div style="height:200px;border-radius:12px;background:{{surfaceContainerHigh}};display:grid;place-items:center;color:{{onSurfaceVariant}}"><span class="ms" aria-hidden="true" style="font-size:72px">{{pv.icon}}</span></div>
<div><div style="font-size:22px;line-height:28px">{{pv.file}}</div><div style="color:{{onSurfaceVariant}}">{{pv.change}}</div></div>
<div role="list" style="display:flex;flex-direction:column">
<sc-for list="{{pvFacts}}" as="x" hint-placeholder-count="4"><div role="listitem" style="display:flex;align-items:center;gap:12px;min-height:40px;border-bottom:1px solid {{outlineVariant}}"><span class="ms" aria-hidden="true" style="font-size:20px;color:{{onSurfaceVariant}}">{{x.icon}}</span><span style="flex:1;color:{{onSurfaceVariant}}">{{x.label}}</span><span style="font-weight:500">{{x.value}}</span></div></sc-for>
</div>
<div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
<button type="button" style="{{btnFilledWide}}"><span class="ms" aria-hidden="true" style="font-size:18px">restore</span>Restore this version</button>
<button type="button" style="{{btnOutlinedWide}}"><span class="ms" aria-hidden="true" style="font-size:18px">content_copy</span>Save a copy</button>
</div>
</aside>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seed":{"editor":"enum","options":["green","indigo","amber"],"default":"green"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"motion":{"editor":"enum","options":["on","off"],"default":"on"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { sel: 0, f: { edit:false, delete:false, restore:false } }; }
  renderVals() {
    const t = scheme(this.props.seed ?? 'green', this.props.theme ?? 'dark');
    const u = ui(t, 3);
    const data = [
      ['Today','edit','Quarterly report.pdf','Edited · version 6 · +1.2 MB','19:12','edit'],
      ['Today','restore','Contract.pdf','Restored version 2','11:02','restore'],
      ['Today','delete','Old drafts','Moved to the Recycle Bin · 14 files','09:30','delete'],
      ['Today','edit','Budget 2026.xlsx','Edited · version 12 · 3 cells changed','08:48','edit'],
      ['Yesterday','edit','Brand guidelines.pptx','Edited · version 4 · slide 12 added','16:40','edit'],
      ['Yesterday','delete','Logo-draft.svg','Moved to the Recycle Bin','14:05','delete'],
      ['Yesterday','restore','Interview notes.docx','Restored version 1','10:21','restore'],
      ['Yesterday','edit','Style guide.pdf','Edited · version 3','09:15','edit']
    ].map(([day, icon, file, change, time, type]) => ({ day, icon, file, change, time, type }));
    const f = this.state.f;
    const none = !f.edit && !f.delete && !f.restore;
    const list = data.filter(d => none || f[d.type]);
    const cur = list[Math.min(this.state.sel, list.length - 1)] || data[0];
    let last = '';
    const entries = [];
    list.forEach((d, i) => {
      if (d.day !== last) { last = d.day; entries.push({ head: d.day, headStyle: 'margin:0;padding:16px 16px 8px;font-size:14px;line-height:20px;font-weight:500;color:' + t.primary, rowStyle: 'display:none', wrap: 'display:block' }); }
      const on = cur === d;
      entries.push({ ...d, head: '', headStyle: 'display:none', wrap: 'display:block',
        rowStyle: 'display:flex;align-items:center;gap:8px;height:72px;border-radius:12px;padding-right:8px;background:' + (on ? t.secondaryContainer : 'transparent'),
        pressed: String(on), pick: () => this.setState({ sel: i }),
        mainStyle: 'flex:1;min-width:0;height:72px;display:flex;align-items:center;gap:16px;padding:0 16px;border:0;border-radius:12px;background:transparent;cursor:pointer;text-align:left;color:inherit',
        iconBox: 'width:40px;height:40px;border-radius:999px;display:grid;place-items:center;flex:0 0 auto;background:' + (d.type === 'delete' ? t.errorContainer : t.primaryContainer) + ';color:' + (d.type === 'delete' ? t.onErrorContainer : t.onPrimaryContainer) });
    });
    const toggle = (k) => () => this.setState({ f: { ...f, [k]: !f[k] }, sel: 0 });
    return { ...t, ...u, motion: this.props.motion ?? 'on',
      entries,
      chips: [['edit','Edits','edit'],['delete','Deletes','delete'],['restore','Restores','restore']].map(([k, label, icon]) => ({ label, icon: f[k] ? 'check' : icon, pressed: String(f[k]), pick: toggle(k),
        iconStyle: 'font-size:18px',
        style: 'height:32px;padding:0 12px 0 8px;border-radius:8px;display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer;border:' + (f[k] ? '0' : '1px solid ' + t.outlineVariant) + ';background:' + (f[k] ? t.secondaryContainer : 'transparent') + ';color:' + (f[k] ? t.onSecondaryContainer : t.onSurfaceVariant) })),
      pv: cur,
      pvFacts: [['schedule','When', cur.day + ' ' + cur.time],['hard_drive','Drive','Studio'],['person','Changed by','studio-owner'],['data_usage','Size','4.2 MB']].map(([icon,label,value]) => ({ icon, label, value }))
    };
  }
}
function ui(t, selected) {
  const railDefs = [['Home','home'],['Drives','hard_drive'],['Offline','offline_pin'],['History','history'],['Backup','cloud_upload'],['Shared','share'],['Tools','build'],['Settings','settings']];
  const B = (bg, fg, border, pad, extra) => 'height:40px;padding:' + (pad || '0 24px 0 16px') + ';border-radius:999px;border:' + (border || '0') + ';background:' + bg + ';color:' + fg + ';display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;cursor:pointer;white-space:nowrap;' + (extra || '');
  return {
    rail: railDefs.map(([label, icon], i) => ({ label, icon, iconClass: i === selected ? 'ms fill' : 'ms', color: i === selected ? t.onSurface : t.onSurfaceVariant,
      pill: 'width:56px;height:32px;border-radius:16px;display:grid;place-items:center;background:' + (i === selected ? t.secondaryContainer : 'transparent') + ';color:' + (i === selected ? t.onSecondaryContainer : 'inherit') })),
    btnText: B('transparent', t.primary, '0', '0 12px 0 8px'),
    btnFilledWide: B(t.primary, t.onPrimary, '0', null, 'width:100%'), btnOutlinedWide: B('transparent', t.primary, '1px solid ' + t.outline, null, 'width:100%'),
    btnRegex: B(t.secondaryContainer, t.onSecondaryContainer, '0', '0 16px 0 12px'),
    searchBox: 'display:flex;align-items:center;gap:12px;width:420px;height:56px;border-radius:999px;background:' + t.surfaceContainerHigh + ';padding:0 8px 0 16px'
  };
}
function scheme(seed, theme) {
  const dark = theme !== 'light';
  const seeds = {
    green:  dark ? { primary:'#8FD6B0', onPrimary:'#003825', primaryContainer:'#00513A', onPrimaryContainer:'#AAF2CB', secondaryContainer:'#354B40', onSecondaryContainer:'#CFE9D9', tertiaryContainer:'#234C5D', onTertiaryContainer:'#C1E8FB' }
                 : { primary:'#2B6A4E', onPrimary:'#FFFFFF', primaryContainer:'#AFF1CE', onPrimaryContainer:'#002114', secondaryContainer:'#CFE9D9', onSecondaryContainer:'#0B1F15', tertiaryContainer:'#C1E8FB', onTertiaryContainer:'#001F2A' },
    indigo: dark ? { primary:'#B9C3FF', onPrimary:'#1F2C61', primaryContainer:'#364379', onPrimaryContainer:'#DDE1FF', secondaryContainer:'#424659', onSecondaryContainer:'#DFE1F9', tertiaryContainer:'#5C3D58', onTertiaryContainer:'#FFD6F7' }
                 : { primary:'#4D5C92', onPrimary:'#FFFFFF', primaryContainer:'#DDE1FF', onPrimaryContainer:'#05164B', secondaryContainer:'#DFE1F9', onSecondaryContainer:'#171B2C', tertiaryContainer:'#FFD6F7', onTertiaryContainer:'#2C1229' },
    amber:  dark ? { primary:'#F5BD6F', onPrimary:'#452B00', primaryContainer:'#633F00', onPrimaryContainer:'#FFDDB3', secondaryContainer:'#574431', onSecondaryContainer:'#FBDEBC', tertiaryContainer:'#3E4E2E', onTertiaryContainer:'#D5EDBA' }
                 : { primary:'#835416', onPrimary:'#FFFFFF', primaryContainer:'#FFDDB3', onPrimaryContainer:'#2A1700', secondaryContainer:'#FBDEBC', onSecondaryContainer:'#271904', tertiaryContainer:'#D5EDBA', onTertiaryContainer:'#11200A' }
  };
  const neutral = dark
    ? { surface:'#101413', surfaceContainerLowest:'#0B0F0E', surfaceContainerLow:'#181D1B', surfaceContainer:'#1C211F', surfaceContainerHigh:'#272B29', surfaceContainerHighest:'#313634', onSurface:'#E0E3E0', onSurfaceVariant:'#C0C9C3', outline:'#8A938D', outlineVariant:'#404944', error:'#FFB4AB', onError:'#690005', errorContainer:'#93000A', onErrorContainer:'#FFDAD6', inverseSurface:'#E0E3E0', inverseOnSurface:'#2D3130', scrim:'rgba(0,0,0,.5)', shadow:'rgba(0,0,0,.45)' }
    : { surface:'#F7FAF7', surfaceContainerLowest:'#FFFFFF', surfaceContainerLow:'#F1F4F1', surfaceContainer:'#EBEFEB', surfaceContainerHigh:'#E6E9E6', surfaceContainerHighest:'#E0E3E0', onSurface:'#191C1B', onSurfaceVariant:'#404944', outline:'#707973', outlineVariant:'#C0C9C3', error:'#BA1A1A', onError:'#FFFFFF', errorContainer:'#FFDAD6', onErrorContainer:'#410002', inverseSurface:'#2D3130', inverseOnSurface:'#EEF1EE', scrim:'rgba(0,0,0,.32)', shadow:'rgba(0,0,0,.18)' };
  return { ...neutral, ...(seeds[seed] || seeds.green) };
}
</script>
</body>
</html>
