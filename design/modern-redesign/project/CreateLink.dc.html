<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create a download link</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';user-select:none}
.ms.fill{font-variation-settings:'FILL' 1}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
[data-motion=off] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,select{font:inherit;color:inherit}
</style>
</helmet>
<div data-motion="{{motion}}" style="position:relative;width:1440px;height:960px;display:flex;font-family:'Roboto Flex',system-ui,sans-serif;font-size:14px;line-height:20px;color:{{onSurface}};background:{{surface}};overflow:hidden">
<nav aria-hidden="true" style="flex:0 0 96px;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:24px">
<span style="width:56px;height:56px;border-radius:16px;background:{{primaryContainer}};color:{{onPrimaryContainer}};display:grid;place-items:center;margin-bottom:16px"><span class="ms">add</span></span>
<sc-for list="{{rail}}" as="r" hint-placeholder-count="8">
<span style="display:flex;flex-direction:column;align-items:center;gap:4px;color:{{r.color}};width:80px"><span style="{{r.pill}}"><span class="{{r.iconClass}}">{{r.icon}}</span></span><span style="font-size:12px;line-height:16px;font-weight:500">{{r.label}}</span></span>
</sc-for>
</nav>
<main aria-hidden="true" style="flex:1;padding:24px 24px 24px 0;display:flex;min-width:0">
<div style="flex:1;border-radius:28px;background:{{surfaceContainerLow}};padding:24px;display:flex;flex-direction:column;gap:20px;overflow:hidden">
<h1 style="margin:0;font-size:32px;line-height:40px;font-weight:400">File hosting</h1>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px"><div style="height:250px;border-radius:16px;background:{{surfaceContainerHighest}}"></div><div style="height:250px;border-radius:16px;background:{{surfaceContainerHighest}}"></div></div>
<div style="flex:1;border-radius:16px;border:1px solid {{outlineVariant}}"></div>
</div>
</main>
<div style="position:absolute;inset:0;background:{{scrim}}"></div>
<div role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="position:absolute;left:210px;top:96px;width:1020px;box-sizing:border-box;border-radius:28px;background:{{surfaceContainerHigh}};padding:24px;box-shadow:0 8px 24px {{shadow}};animation:pop 200ms cubic-bezier(.05,.7,.1,1) both">
<h2 id="dlg-title" style="margin:0 0 20px;font-size:24px;line-height:32px;font-weight:400">Create a download link</h2>
<div style="display:flex;gap:24px">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;gap:12px">
<label style="flex:1;position:relative;display:block"><span style="position:absolute;left:12px;top:-9px;padding:0 4px;background:{{surfaceContainerHigh}};font-size:12px;line-height:16px;color:{{onSurfaceVariant}}">Shared file</span>
<select aria-label="Shared file" style="width:100%;height:56px;border-radius:4px;border:1px solid {{outline}};background:transparent;padding:0 12px;font-size:16px;color:{{onSurface}}"><option style="color:#000">Quarterly report.pdf · 2.4 MB</option><option style="color:#000">Wedding album.zip · 1.2 GB</option><option style="color:#000">Studio mix v4.wav · 86 MB</option></select></label>
<label style="flex:1;position:relative;display:block"><span style="position:absolute;left:12px;top:-9px;padding:0 4px;background:{{surfaceContainerHigh}};font-size:12px;line-height:16px;color:{{onSurfaceVariant}}">Instance</span>
<select aria-label="Instance" style="width:100%;height:56px;border-radius:4px;border:1px solid {{outline}};background:transparent;padding:0 12px;font-size:16px;color:{{onSurface}}"><option style="color:#000">Home server · 1.0.0</option><option style="color:#000">Office NAS · 0.9.8</option></select></label>
</div>
<div>
<div style="font-size:14px;font-weight:500;margin-bottom:8px;color:{{onSurfaceVariant}}">Link expires</div>
<div role="group" aria-label="Link expires" style="display:flex;height:40px;border-radius:999px;border:1px solid {{outline}};overflow:hidden">
<sc-for list="{{expiries}}" as="e" hint-placeholder-count="5"><button type="button" onClick="{{e.pick}}" aria-pressed="{{e.pressed}}" style="{{e.style}}"><span class="ms" aria-hidden="true" style="{{e.checkStyle}}">check</span>{{e.label}}</button></sc-for>
</div>
<p style="margin:8px 0 0;color:{{onSurfaceVariant}};font-size:12px;line-height:16px">{{expiryNote}}</p>
</div>
<div>
<div style="font-size:14px;font-weight:500;margin-bottom:8px;color:{{onSurfaceVariant}}">Delete after</div>
<div role="group" aria-label="Delete after" style="display:flex;gap:8px;flex-wrap:wrap">
<sc-for list="{{limits}}" as="c" hint-placeholder-count="5"><button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}"><span class="ms" aria-hidden="true" style="{{c.checkStyle}}">check</span>{{c.label}}</button></sc-for>
</div>
<p style="margin:8px 0 0;color:{{onSurfaceVariant}};font-size:12px;line-height:16px">Number of downloads before the link ends.</p>
</div>
<div style="display:flex;flex-direction:column;gap:4px">
<sc-for list="{{switches}}" as="w" hint-placeholder-count="2">
<div style="display:flex;align-items:center;gap:16px;min-height:56px"><span style="flex:1"><span style="display:block;font-size:16px;line-height:24px">{{w.label}}</span><span style="display:block;color:{{onSurfaceVariant}};font-size:12px;line-height:16px">{{w.hint}}</span></span>
<button type="button" role="switch" aria-checked="{{w.on}}" aria-label="{{w.label}}" onClick="{{w.toggle}}" style="{{w.track}}"><span style="{{w.handle}}"></span></button></div>
</sc-for>
</div>
</div>
<aside aria-label="Link preview" style="flex:0 0 300px;border-radius:16px;background:{{surfaceContainerHighest}};padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px">
<div role="img" aria-label="QR code for the download link" style="padding:12px;border-radius:12px;background:#FFFFFF;display:grid;grid-template-columns:repeat(25,8px);grid-auto-rows:8px">
<sc-for list="{{cells}}" as="q" hint-placeholder-count="625"><span style="{{q.s}}"></span></sc-for>
</div>
<div style="width:100%;text-align:center"><div style="font-size:12px;line-height:16px;color:{{onSurfaceVariant}}">Link</div><div style="font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:18px;word-break:break-all">https://files-studio-owner.tunnel.example.net/d/k7Qm2xR9</div></div>
<div style="display:flex;flex-direction:column;gap:8px;width:100%">
<button type="button" style="{{btnTonalFull}}"><span class="ms" aria-hidden="true" style="font-size:18px">content_copy</span>Copy link</button>
<button type="button" style="{{btnOutlinedFull}}"><span class="ms" aria-hidden="true" style="font-size:18px">download</span>Save QR as PNG</button>
</div>
</aside>
</div>
<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:24px">
<button type="button" style="{{btnText}}"><span class="ms" aria-hidden="true" style="font-size:18px">close</span>Cancel</button>
<button type="button" style="{{btnFilled}}"><span class="ms" aria-hidden="true" style="font-size:18px">link</span>Create link</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seed":{"editor":"enum","options":["green","indigo","amber"],"default":"green"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"motion":{"editor":"enum","options":["on","off"],"default":"on"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { exp:'1 day', lim:'3', sw1:true, sw2:false }; }
  renderVals() {
    const t = scheme(this.props.seed ?? 'green', this.props.theme ?? 'dark');
    const s = this.state;
    const railDefs = [['Home','home'],['Drives','hard_drive'],['Offline','offline_pin'],['History','history'],['Backup','cloud_upload'],['Shared','share'],['Tools','build'],['Settings','settings']];
    const sel = 5;
    const base = 'height:40px;padding:0 24px 0 16px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;cursor:pointer;white-space:nowrap;';
    const N = 25;
    let seedv = 20260918;
    const rnd = () => { seedv = (seedv * 1664525 + 1013904223) % 4294967296; return seedv / 4294967296; };
    const finder = (r, c) => {
      const boxes = [[0,0],[0,N - 7],[N - 7,0]];
      for (const [br, bc] of boxes) {
        const dr = r - br, dc = c - bc;
        if (dr >= -1 && dr <= 7 && dc >= -1 && dc <= 7) {
          if (dr < 0 || dr > 6 || dc < 0 || dc > 6) return 0;
          const ring = dr === 0 || dr === 6 || dc === 0 || dc === 6;
          const core = dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4;
          return ring || core ? 1 : 0;
        }
      }
      return null;
    };
    const cells = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const f = finder(r, c);
      let on = f !== null ? f === 1 : rnd() > 0.52;
      if (f === null && (r === 6 || c === 6)) on = (r + c) % 2 === 0;
      cells.push({ s: 'display:block;width:8px;height:8px;background:' + (on ? '#000000' : '#FFFFFF') });
    }
    const seg = (label, i, n) => ({ label,
      pick: () => this.setState({ exp: label }), pressed: s.exp === label ? 'true' : 'false',
      checkStyle: 'font-size:18px;display:' + (s.exp === label ? 'inline-block' : 'none'),
      style: 'flex:1;border:0;' + (i < n - 1 ? 'border-right:1px solid ' + t.outline + ';' : '') + 'display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500;cursor:pointer;white-space:nowrap;background:' + (s.exp === label ? t.secondaryContainer : 'transparent') + ';color:' + (s.exp === label ? t.onSecondaryContainer : t.onSurface) });
    const exps = ['1 hour','1 day','7 days','30 days','Pick a date'];
    const until = { '1 hour':'Today 20:41', '1 day':'Tomorrow 19:41', '7 days':'25 Nov 19:41', '30 days':'18 Dec 19:41', 'Pick a date':'Choose a date and a 24-hour time' };
    const lims = [['none','No limit'],['1','1'],['3','3'],['10','10'],['custom','Custom']];
    const sw = (key, label, hint) => { const on = s[key]; return { label, hint, on: on ? 'true' : 'false',
      toggle: () => { const n = {}; n[key] = !on; this.setState(n); },
      track: 'position:relative;flex:0 0 52px;width:52px;height:32px;border-radius:999px;cursor:pointer;padding:0;box-sizing:border-box;border:' + (on ? '0' : '2px solid ' + t.outline) + ';background:' + (on ? t.primary : t.surfaceContainerHighest),
      handle: 'position:absolute;top:50%;transform:translateY(-50%);border-radius:999px;transition:all 150ms;' + (on ? 'left:25px;width:24px;height:24px;background:' + t.onPrimary : 'left:6px;width:16px;height:16px;background:' + t.outline) }; };
    return { ...t, motion: this.props.motion ?? 'on', cells,
      btnFilled: base + 'border:0;background:' + t.primary + ';color:' + t.onPrimary,
      btnText: base + 'padding:0 12px;border:0;background:transparent;color:' + t.primary,
      btnTonalFull: base + 'border:0;background:' + t.secondaryContainer + ';color:' + t.onSecondaryContainer,
      btnOutlinedFull: base + 'border:1px solid ' + t.outline + ';background:transparent;color:' + t.primary,
      expiries: exps.map((l, i) => seg(l, i, exps.length)),
      expiryNote: 'Link ends ' + until[s.exp],
      limits: lims.map(([id, label]) => ({ label, pick: () => this.setState({ lim: id }), pressed: s.lim === id ? 'true' : 'false',
        checkStyle: 'font-size:18px;display:' + (s.lim === id ? 'inline-block' : 'none'),
        style: 'height:32px;padding:0 12px;border-radius:8px;display:flex;align-items:center;gap:6px;font-weight:500;cursor:pointer;white-space:nowrap;background:' + (s.lim === id ? t.secondaryContainer : 'transparent') + ';color:' + (s.lim === id ? t.onSecondaryContainer : t.onSurfaceVariant) + ';border:' + (s.lim === id ? '0' : '1px solid ' + t.outlineVariant) })),
      switches: [sw('sw1','Also remove from Docker Hub when the link ends','The uploaded copy is deleted from your repository'), sw('sw2','Download into the server cache now','Faster first download, uses cache space')],
      rail: railDefs.map(([label, icon], i) => ({ label, icon, iconClass: i === sel ? 'ms fill' : 'ms', color: i === sel ? t.onSurface : t.onSurfaceVariant,
        pill: 'width:56px;height:32px;border-radius:16px;display:grid;place-items:center;background:' + (i === sel ? t.secondaryContainer : 'transparent') + ';color:' + (i === sel ? t.onSecondaryContainer : 'inherit') }))
    };
  }
}
function scheme(seed, theme) {
  const dark = theme !== 'light';
  const seeds = {
    green:  dark ? { primary:'#8FD6B0', onPrimary:'#003825', primaryContainer:'#00513A', onPrimaryContainer:'#AAF2CB', secondaryContainer:'#354B40', onSecondaryContainer:'#CFE9D9', tertiaryContainer:'#234C5D', onTertiaryContainer:'#C1E8FB' }
                 : { primary:'#2B6A4E', onPrimary:'#FFFFFF', primaryContainer:'#AFF1CE', onPrimaryContainer:'#002114', secondaryContainer:'#CFE9D9', onSecondaryContainer:'#0B1F15', tertiaryContainer:'#C1E8FB', onTertiaryContainer:'#001F2A' },
    indigo: dark ? { primary:'#B9C3FF', onPrimary:'#1F2C61', primaryContainer:'#364379', onPrimaryContainer:'#DDE1FF', secondaryContainer:'#424659', onSecondaryContainer:'#DFE1F9', tertiaryContainer:'#5C3D58', onTertiaryContainer:'#FFD6F7' }
                 : { primary:'#4D5C92', onPrimary:'#FFFFFF', primaryContainer:'#DDE1FF', onPrimaryContainer:'#05164B', secondaryContainer:'#DFE1F9', onSecondaryContainer:'#171B2C', tertiaryContainer:'#FFD6F7', onTertiaryContainer:'#2C1229' },
    amber:  dark ? { primary:'#F5BD6F', onPrimary:'#452B00', primaryContainer:'#633F00', onPrimaryContainer:'#FFDDB3', secondaryContainer:'#574431', onSecondaryContainer:'#FBDEBC', tertiaryContainer:'#3E4E2E', onTertiaryContainer:'#D5EDBA' }
                 : { primary:'#835416', onPrimary:'#FFFFFF', primaryContainer:'#FFDDB3', onPrimaryContainer:'#2A1700', secondaryContainer:'#FBDEBC', onSecondaryContainer:'#271904', tertiaryContainer:'#D5EDBA', onTertiaryContainer:'#11200A' }
  };
  const neutral = dark
    ? { surface:'#101413', surfaceContainerLowest:'#0B0F0E', surfaceContainerLow:'#181D1B', surfaceContainer:'#1C211F', surfaceContainerHigh:'#272B29', surfaceContainerHighest:'#313634', onSurface:'#E0E3E0', onSurfaceVariant:'#C0C9C3', outline:'#8A938D', outlineVariant:'#404944', error:'#FFB4AB', onError:'#690005', errorContainer:'#93000A', onErrorContainer:'#FFDAD6', inverseSurface:'#E0E3E0', inverseOnSurface:'#2D3130', scrim:'rgba(0,0,0,.5)', shadow:'rgba(0,0,0,.45)' }
    : { surface:'#F7FAF7', surfaceContainerLowest:'#FFFFFF', surfaceContainerLow:'#F1F4F1', surfaceContainer:'#EBEFEB', surfaceContainerHigh:'#E6E9E6', surfaceContainerHighest:'#E0E3E0', onSurface:'#191C1B', onSurfaceVariant:'#404944', outline:'#707973', outlineVariant:'#C0C9C3', error:'#BA1A1A', onError:'#FFFFFF', errorContainer:'#FFDAD6', onErrorContainer:'#410002', inverseSurface:'#2D3130', inverseOnSurface:'#EEF1EE', scrim:'rgba(0,0,0,.32)', shadow:'rgba(0,0,0,.18)' };
  return { ...neutral, ...(seeds[seed] || seeds.green) };
}
</script>
</body>
</html>
