name: Publish documentation site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/site/**', 'docs/images/**', 'scripts/build-site.mjs', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Stage site and shared images
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
          token: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out/site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Update and verify repository homepage
        if: github.repository == 'Ding-Ding-Projects/material-file-encryptor'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || github.token }}
        run: |
          gh api --method PATCH repos/Ding-Ding-Projects/material-file-encryptor -f homepage=https://ding-ding-projects.github.io/material-file-encryptor/ --silent
          gh api repos/Ding-Ding-Projects/material-file-encryptor --jq .homepage
